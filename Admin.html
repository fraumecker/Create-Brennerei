    <script>
      let adminPinToken = '';
      let mitgliederCache = [];
      let sucheTimer = null;
      let aktuellerModus = 'bearbeiten';
      let aktuelleZeile = 0;

      let mitgliederSucheRequestId = 0;
      let speichernRequestLaeuft = false;

      let adminAppIstGeschlossen = false;

      const feldMap = {
        'MitgliederID':        'feldMitgliederID',
        'Stoffbesitzernummer': 'feldStoffbesitzernummer',
        'Zuname':              'feldZuname',

        'Telefon':             'feldTelefon',
        'E-Mail':              'feldEmail',
        'Vereinsmitglied':     'feldVereinsmitglied',
        'NameAnzeige':         'feldNameAnzeige'
      };

      function adminAppSchliessen(evt) {
        /*
          Mobilbrowser und installierte Web-Apps dürfen nicht per JavaScript
          geschlossen werden. Diese Funktion erzeugt deshalb eine echte,
          sichtbare Abschlussansicht innerhalb derselben Seite.
        */

        if (evt && typeof evt.preventDefault === 'function') evt.preventDefault();
        if (evt && typeof evt.stopPropagation === 'function') evt.stopPropagation();

        try {
          if (window.event) {
            window.event.preventDefault();
            window.event.stopPropagation();
          }
        } catch (e0) {}

        try {
          if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
          }
        } catch (e1) {}

        adminAppIstGeschlossen = true;
        adminPinToken = '';
        mitgliederCache = [];
        aktuelleZeile = 0;
        aktuellerDriveUrl = '';
        aktuellerModus = 'neu';
        speichernRequestLaeuft = false;
        ordnerRequestLaeuft = false;
        mitgliederSucheRequestId++;

        if (sucheTimer) {
          window.clearTimeout(sucheTimer);
          sucheTimer = null;
        }

        try {
          sessionStorage.clear();
        } catch (e2) {}

        try {
          localStorage.removeItem('adminPinToken');
          localStorage.removeItem('adminPin');
          localStorage.removeItem('pin');
        } catch (e3) {}

        let overlay = document.getElementById('adminBeendetOverlay');

        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'adminBeendetOverlay';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-modal', 'true');
          document.body.appendChild(overlay);
        }

        overlay.innerHTML =
          '<div class="admin-beendet-box">' +
            '<div class="admin-beendet-title">Admin beendet</div>' +
            '<div class="admin-beendet-text">Die Admin-Sitzung wurde beendet.</div>' +
            '<div class="admin-beendet-hinweis">Du bist fertig. Bitte gehe jetzt mit der Home-Geste, Zurück-Geste oder über den App-Wechsler zurück zum Handy-Bildschirm.</div>' +
          '</div>';

        try {
          const mainFrame = document.querySelector('.main-frame');
          if (mainFrame) mainFrame.style.display = 'none';
        } catch (e4) {}

        document.documentElement.style.setProperty('height', '100%', 'important');
        document.body.style.setProperty('min-height', '100vh', 'important');
        document.body.style.setProperty('overflow', 'hidden', 'important');
        document.body.style.setProperty('background', '#f4f4f4', 'important');

        overlay.style.setProperty('position', 'fixed', 'important');
        overlay.style.setProperty('inset', '0', 'important');
        overlay.style.setProperty('z-index', '2147483647', 'important');
        overlay.style.setProperty('display', 'flex', 'important');
        overlay.style.setProperty('align-items', 'center', 'important');
        overlay.style.setProperty('justify-content', 'center', 'important');
        overlay.style.setProperty('padding', '24px', 'important');
        overlay.style.setProperty('box-sizing', 'border-box', 'important');
        overlay.style.setProperty('background', '#f4f4f4', 'important');
        overlay.style.setProperty('color', '#111111', 'important');

        try {
          window.scrollTo(0, 0);
        } catch (e5) {}

        return false;
      }

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text || '';
      }

      let adminToastTimer = null;

      function showToast(message, type, durationMs) {
        const toast = document.getElementById('adminToast');
        if (!toast) return;

        if (adminToastTimer) {
          clearTimeout(adminToastTimer);
          adminToastTimer = null;
        }

        toast.textContent = message || '';

        if (type === 'success') {
          toast.style.background = '#12a139';
          toast.style.color = '#ffffff';
          toast.style.border = '1px solid #9dffb1';
          toast.style.boxShadow = '0 0 22px rgba(57,255,20,0.65), 0 16px 34px rgba(0,0,0,0.55)';
        } else if (type === 'error') {
          toast.style.background = '#7d1225';
          toast.style.color = '#ffffff';
          toast.style.border = '1px solid #ffb6c9';
          toast.style.boxShadow = '0 16px 34px rgba(0,0,0,0.55)';
        } else {
          toast.style.background = '#1c1c1c';
          toast.style.color = '#eeeeee';
          toast.style.border = '1px solid #555555';
          toast.style.boxShadow = '0 16px 34px rgba(0,0,0,0.55)';
        }

        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';

        if (durationMs && durationMs > 0) {
          adminToastTimer = setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(24px)';
          }, durationMs);
        }
      }

      function setBusy(selector, busy) {
        const el = document.querySelector(selector);
        if (!el) return;

        el.disabled = !!busy;
        el.style.opacity = busy ? '0.65' : '';
        el.style.pointerEvents = busy ? 'none' : '';
      }

      function appStartEventsBinden() {
        const pin = document.getElementById('adminPin');

        if (pin) {
          pin.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              adminPinFreischalten();
            }
          });
        }
      }

      function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function(m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      function ansichtSuche() {
        document.getElementById('mitgliederSucheMaske').classList.remove('admin-hidden');
        document.getElementById('mitgliederDetailMaske').classList.add('admin-hidden');
      }

      function ansichtDetail() {
        document.getElementById('mitgliederSucheMaske').classList.add('admin-hidden');
        document.getElementById('mitgliederDetailMaske').classList.remove('admin-hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function adminPinFreischalten() {
        const pinFeld = document.getElementById('adminPin');
        const pin = pinFeld ? pinFeld.value.trim() : '';

        if (!pin) {
          setText('pinStatus', 'PIN fehlt.');
          showToast('PIN fehlt.', 'error', 4000);
          return;
        }

        setText('pinStatus', 'PIN wird geprüft ...');
        showToast('PIN wird geprüft ...', 'success', 0);
        setBusy('#pinBox .admin-pink-btn', true);

        google.script.run
          .withSuccessHandler(function(res) {
            if (adminAppIstGeschlossen) return;
            setBusy('#pinBox .admin-pink-btn', false);

            if (!res || !res.ok) {
              setText('pinStatus', 'PIN ungültig.');
              showToast('PIN ungültig.', 'error', 4000);
              return;
            }

            adminPinToken = pin;

            document.getElementById('mitgliederBereich').classList.remove('admin-hidden');
            document.body.classList.add('admin-members-open');

            setText('pinStatus', '');
            showToast('Freigegeben. Bitte suchen.', 'success', 2600);
            sucheLeeren();

            mitgliederCache = [];
            renderMitgliederTreffer();

            setText('listenStatus', '');
            ansichtSuche();

            const suche = document.getElementById('mitgliedSuche');
            if (suche) suche.focus();
          })
          .withFailureHandler(function(err) {
            if (adminAppIstGeschlossen) return;
            setBusy('#pinBox .admin-pink-btn', false);
            const msg = err && err.message ? err.message : String(err);
            setText('pinStatus', msg);
            showToast(msg, 'error', 6000);
          })
          .adminMitgliederPinPruefen(pin);
      }

      function zurueckZumAdminMenue() {
        document.body.classList.remove('admin-members-open');
        document.getElementById('mitgliederBereich').classList.add('admin-hidden');

        adminPinToken = '';
        mitgliederSucheRequestId++;

        const pin = document.getElementById('adminPin');
        if (pin) pin.value = '';

        sucheLeeren();
        formularLeeren({ ohneAnsichtWechsel: true });

        mitgliederCache = [];
        renderMitgliederTreffer();

        setText('listenStatus', '');
        setText('pinStatus', '');
        showToast('', 'info', 1);
      }

      function mitgliederSucheVerzoegert() {
        clearTimeout(sucheTimer);

        const suchtext = document.getElementById('mitgliedSuche').value.trim();

        if (suchtext.length < 2) {
          mitgliederCache = [];
          renderMitgliederTreffer();
          setText('listenStatus', '');
          return;
        }

        sucheTimer = setTimeout(function() {
          mitgliederLaden(false);
        }, 250);
      }

      function mitgliederLaden(force) {
        if (!adminPinToken) {
          showToast('PIN fehlt.', 'error', 4000);
          return;
        }

        const sucheFeld = document.getElementById('mitgliedSuche');
        const suchtext = sucheFeld ? sucheFeld.value.trim() : '';

        if (suchtext.length < 2) {
          mitgliederSucheRequestId++;
          mitgliederCache = [];
          renderMitgliederTreffer();
          if (force) showToast('Mindestens 2 Zeichen eingeben.', 'error', 3000);
          return;
        }

        const requestId = ++mitgliederSucheRequestId;

        showToast('Mitglieder werden geladen ...', 'success', 0);

        google.script.run
          .withSuccessHandler(function(res) {
            if (adminAppIstGeschlossen) return;
            if (requestId !== mitgliederSucheRequestId) return;

            const roh = res && res.mitglieder ? res.mitglieder : [];

            mitgliederCache = roh.filter(function(m) {
              return mitgliedHatInhalt(m);
            });

            renderMitgliederTreffer();

            setText(
              'listenStatus',
              mitgliederCache.length ? mitgliederCache.length + ' Treffer. Eintrag anklicken.' : 'Keine Treffer'
            );

            if (!mitgliederCache.length) {
              showToast('Keine Treffer', 'error', 3200);
            } else {
              showToast(mitgliederCache.length + ' Treffer', 'success', 2600);
            }
          })
          .withFailureHandler(function(err) {
            if (adminAppIstGeschlossen) return;
            if (requestId !== mitgliederSucheRequestId) return;
            const msg = err && err.message ? err.message : String(err);
            setText('listenStatus', msg);
            showToast(msg, 'error', 6000);
          })
          .adminMitgliederListeLaden(adminPinToken, suchtext);
      }

      function mitgliedHatInhalt(m) {
        if (!m) return false;

        return !!String([
          m.NameAnzeige,
          m.Zuname,
          m.Vorname,
          m.Stoffbesitzernummer,
          m.Wohnort,
          m['Geb.datum'],
          m.Telefon,
          m['E-Mail']
        ].join('')).trim();
      }

      function mitgliedName(m) {
        const nameAnzeige = String(m && m.NameAnzeige ? m.NameAnzeige : '').trim();

        if (nameAnzeige) return nameAnzeige;

        const teile = [];

        if (m && m.Zuname) teile.push(String(m.Zuname).trim());
        if (m && m.Vorname) teile.push(String(m.Vorname).trim());

        return teile.filter(Boolean).join(', ');
      }

      function renderMitgliederTreffer() {
        const box = document.getElementById('mitgliederTreffer');

        if (!box) return;

        if (!mitgliederCache.length) {
          box.innerHTML = '';
          return;
        }

        box.innerHTML = mitgliederCache.map(function(m, idx) {
          const meta = [
            m.Stoffbesitzernummer ? 'SB ' + m.Stoffbesitzernummer : '',
            m.Wohnort || '',
            m['Geb.datum'] ? 'Geb. ' + m['Geb.datum'] : '',
            m.Telefon || ''
          ].filter(Boolean).join(' · ');

          return '<div class="admin-result-card" onclick="mitgliedAuswaehlen(' + idx + ')">' +
            '<div><div class="admin-result-name">' + esc(mitgliedName(m)) + '</div>' +
            '<div class="admin-result-meta">' + esc(meta) + '</div></div>' +
            '<button class="admin-pink-btn" type="button" onclick="event.stopPropagation(); mitgliedAuswaehlen(' + idx + ')">Ansehen</button>' +
          '</div>';
        }).join('');
      }

      function formularLeeren(optionen) {
        const opts = optionen || {};

        Object.keys(feldMap).forEach(function(key) {
          const el = document.getElementById(feldMap[key]);
          if (el) el.value = '';
        });

        aktuelleZeile = 0;
        aktuellerModus = 'neu';
        aktuellerDriveUrl = '';

        const drive = document.getElementById('feldDriveOrdner');
        if (drive) drive.value = '';

        setText('detailStatus', '');

        if (!opts.ohneAnsichtWechsel) ansichtDetail();
      }

      function sucheLeeren() {
        const suche = document.getElementById('mitgliedSuche');
        if (suche) suche.value = '';
      }

      function neuesMitgliedVorbereiten() {
        formularLeeren();
      }

      function mitgliedAuswaehlen(index) {
        const m = mitgliederCache[index];

        if (!m) return;

        aktuelleZeile = Number(m._zeile || 0);
        aktuellerModus = 'bearbeiten';
        aktuellerDriveUrl = m.DriveOrdnerUrl || '';

        Object.keys(feldMap).forEach(function(key) {
          const el = document.getElementById(feldMap[key]);

          if (!el) return;

          if (key === 'Vereinsmitglied') {
            el.value = istVereinsmitgliedJa(m[key]) ? 'x' : '';
          } else {
            el.value = m[key] || '';
          }
        });

        const drive = document.getElementById('feldDriveOrdner');
        if (drive) drive.value = aktuellerDriveUrl || '';

        setText('detailStatus', '');
        ansichtDetail();
      }

      function zurueckZurMitgliedersuche() {
        ansichtSuche();
      }

      function istVereinsmitgliedJa(wert) {
        const v = String(wert == null ? '' : wert).trim().toLowerCase();

        return v === 'x' || v === 'ja' || v === 'j' || v === 'true' || v === '1';
      }

      function payloadAusFormular() {
        const driveFeld = document.getElementById('feldDriveOrdner');
        const payload = {
          _zeile: aktuelleZeile,
          _modus: aktuellerModus,
          DriveOrdnerUrl: driveFeld && driveFeld.value ? driveFeld.value.trim() : (aktuellerDriveUrl || '')
        };

        Object.keys(feldMap).forEach(function(key) {
          const el = document.getElementById(feldMap[key]);

          if (!el) {
            payload[key] = '';
          } else if (key === 'Vereinsmitglied') {
            payload[key] = el.value === 'x' ? 'x' : '';
          } else {
            payload[key] = el.value.trim();
          }
        });

        return payload;
      }

      function mitgliedSpeichern() {
        if (speichernRequestLaeuft) return;

        if (!adminPinToken) {
          setText('detailStatus', 'PIN fehlt.');
          showToast('PIN fehlt.', 'error', 4000);
          return;
        }

        const payload = payloadAusFormular();

        if (!payload.Zuname && !payload.Vorname && !payload.NameAnzeige) {
          setText('detailStatus', 'Name fehlt.');
          showToast('Name fehlt.', 'error', 4000);
          return;
        }

        speichernRequestLaeuft = true;
        setBusy('#mitgliederDetailMaske .admin-green-btn', true);
        setText('detailStatus', 'Speichern ...');
        showToast('Wird gespeichert ...', 'success', 0);

        google.script.run
          .withSuccessHandler(function(res) {
            if (adminAppIstGeschlossen) return;
            speichernRequestLaeuft = false;
            setBusy('#mitgliederDetailMaske .admin-green-btn', false);

            if (!res || !res.ok) {
              setText('detailStatus', 'Speichern nicht bestätigt.');
              showToast('Speichern nicht bestätigt.', 'error', 4000);
              return;
            }

            sucheLeeren();
            mitgliederCache = [];
            renderMitgliederTreffer();
            formularLeeren({ ohneAnsichtWechsel: true });
            ansichtSuche();

            setText('listenStatus', '');
            setText('detailStatus', '');
            showToast('Gespeichert ✓', 'success', 3200);
          })
          .withFailureHandler(function(err) {
            if (adminAppIstGeschlossen) return;
            speichernRequestLaeuft = false;
            setBusy('#mitgliederDetailMaske .admin-green-btn', false);
            const msg = err && err.message ? err.message : String(err);
            setText('detailStatus', msg);
            showToast(msg, 'error', 6000);
          })
          .adminMitgliedSpeichern(adminPinToken, payload);
      }

      function driveOrdnerOeffnenOderAnlegen() {
        const driveFeld = document.getElementById('feldDriveOrdner');
        const vorhandeneUrl = driveFeld && driveFeld.value ? driveFeld.value.trim() : aktuellerDriveUrl;

        if (vorhandeneUrl) {
          aktuellerDriveUrl = vorhandeneUrl;
          window.open(vorhandeneUrl, '_blank');
          return;
        }

        if (ordnerRequestLaeuft) return;

        if (!adminPinToken) {
          setText('detailStatus', 'PIN fehlt.');
          showToast('PIN fehlt.', 'error', 4000);
          return;
        }

        const payload = payloadAusFormular();

        if (!payload.Zuname && !payload.Vorname && !payload.NameAnzeige) {
          setText('detailStatus', 'Name fehlt.');
          showToast('Name fehlt — bitte erst Namen eingeben.', 'error', 4000);
          return;
        }

        ordnerRequestLaeuft = true;
        setBusy('#mitgliederDetailMaske .admin-pink-btn', true);
        setText('detailStatus', 'Ordner ...');
        showToast('Drive-Ordner wird gesucht / angelegt ...', 'success', 0);

        google.script.run
          .withSuccessHandler(function(res) {
            if (adminAppIstGeschlossen) return;
            ordnerRequestLaeuft = false;
            setBusy('#mitgliederDetailMaske .admin-pink-btn', false);

            if (!res || !res.ok || !res.url) {
              setText('detailStatus', 'Ordner nicht bestätigt.');
              showToast('Ordner nicht bestätigt.', 'error', 4000);
              return;
            }

            aktuellerDriveUrl = res.url;

            const drive = document.getElementById('feldDriveOrdner');
            if (drive) drive.value = res.url;

            window.open(res.url, '_blank');
            setText('detailStatus', '');
            showToast('Ordner geöffnet ✓', 'success', 2600);
          })
          .withFailureHandler(function(err) {
            if (adminAppIstGeschlossen) return;
            ordnerRequestLaeuft = false;
            setBusy('#mitgliederDetailMaske .admin-pink-btn', false);
            const msg = err && err.message ? err.message : String(err);
            setText('detailStatus', msg);
            showToast(msg, 'error', 6000);
          })
          .adminStoffbesitzerOrdnerSicherstellen(adminPinToken, payload);
      }

      document.addEventListener('DOMContentLoaded', appStartEventsBinden);
    </script>
  </body>
</html>
