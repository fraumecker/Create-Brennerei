<!DOCTYPE html>
<html>
<head>
  <base target="_self">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
      /* GitHub-iframe: Der Google-"Missbrauch melden"-Banner ist ~55px hoch.
         margin-top schiebt den gesamten Inhalt darunter, damit Titel und Buttons sichtbar sind. */
      .main-frame {
        margin-top: 60px !important;
      }

    :root {
      --pink: #ff007f;
      --pink-dark: #800040;
      --neon: #00ff00;
      --bg-dark: #222222;
      --card-bg: #2a2a2a;
      --input-bg: #1a1a1a;
      --line: #444444;
      --text-soft: #bbbbbb;
      --neo-out: 12px 12px 24px #151515, -12px -12px 24px #333333;
      --neo-in: inset 8px 8px 16px #111111, inset -8px -8px 16px #3a3a3a;
      --danger: #8f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-dark);
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: 700;
    }

    body {
      padding: 8px;
      overflow-x: hidden;
    }

    .main-frame {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      background: var(--bg-dark);
      border-radius: 24px;
      box-shadow: var(--neo-out);
      padding: 12px;
      border: 1px solid #333333;
    }

    .header-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-dark);
      padding: 8px 0 10px;
      border-bottom: 1px solid #333333;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    #mainTitle {
      margin: 0;
      color: var(--pink);
      font-weight: 900;
      letter-spacing: 1.2px;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
      font-size: 21px;
      line-height: 1;
    }


    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0;
    }

    .topbar-menu-btn,
    .top-action-btn,
    .btn-inline,
    .btn-inline-secondary,
    .modal-close,
    .modal-btn {
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .topbar-menu-btn:hover,
    .top-action-btn:hover,
    .btn-inline:hover,
    .btn-inline-secondary:hover,
    .modal-close:hover,
    .modal-btn:hover {
      transform: translateY(-1px);
    }

    @keyframes zollPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 4px rgba(55,142,255,0.18), 0 0 16px rgba(55,142,255,1); }
      50% { opacity: 0.55; box-shadow: 0 0 0 7px rgba(55,142,255,0.08), 0 0 24px rgba(55,142,255,1); }
    }

    .topbar-menu-btn,
    .top-action-btn {
      min-height: 40px;
      padding: 9px 12px;
      font-size: 12px;
      line-height: 1;
    }

    .topbar-menu-btn {
      background: var(--card-bg);
      color: var(--neon);
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .topbar-menu-btn.back-webapp-btn {
      min-width: 190px;
    }

    .topbar-menu-btn.current-area-btn {
      color: #ffffff;
      background: linear-gradient(145deg, #333333, #171717);
      cursor: default;
      pointer-events: none;
      text-shadow: none;
    }

    .top-action-btn {
      background: #1f1f1f;
      color: #ffffff;
      position: relative;
    }

    .top-action-btn.protocol-btn {
      min-width: 180px;
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
      text-shadow: none;
    }

    .top-action-btn.zoll-btn {
      min-width: 118px;
      padding-left: 38px;
      background: #10233f;
      color: #ffffff;
      border: 1px solid rgba(55, 142, 255, 0.55);
      box-shadow: 0 0 0 1px rgba(55,142,255,0.16), var(--neo-out);
    }

    .top-action-btn.central-save-btn {
      min-width: 132px;
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
      text-shadow: none;
    }

    .top-action-btn.zoll-btn::before {
      content: "🚨";
      position: absolute;
      left: 11px;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      filter: hue-rotate(175deg) saturate(1.8);
      animation: zollPulse 1.2s ease-in-out infinite;
    }

    .header-panel {
      display: grid;
      grid-template-columns: minmax(250px, 360px) 1fr;
      gap: 10px;
      align-items: start;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: var(--neo-in);
      margin-bottom: 12px;
    }

    .header-panel label {
      color: var(--pink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .date-picker-block {
      display: grid;
      gap: 8px;
    }

    .date-display {
      width: 100%;
      max-width: 100%;
      background: var(--input-bg);
      color: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 900;
      box-shadow: var(--neo-in);
      outline: none;
      min-height: 38px;
    }

    .mini-calendar {
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid #3a3a3a;
    }

    .mini-calendar-head {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      gap: 6px;
      align-items: center;
    }

    .mini-calendar-month {
      text-align: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .mini-calendar-nav {
      min-height: 30px;
      border: none;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--neon);
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
    }

    .mini-calendar-weekdays,
    .mini-calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .mini-calendar-weekdays span {
      text-align: center;
      color: var(--text-soft);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mini-calendar-day {
      min-height: 29px;
      border: 1px solid #343434;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .mini-calendar-day.empty {
      visibility: hidden;
      cursor: default;
    }

    .mini-calendar-day.planned {
      background: #39ff14;
      color: #061306;
      border-color: #c7ffc7;
      box-shadow: 0 0 14px rgba(57, 255, 20, 0.85);
    }

    .mini-calendar-day.completed {
      background: #ffd84d;
      color: #1f1700;
      border-color: #fff1a8;
      box-shadow: 0 0 10px rgba(255, 216, 77, 0.65);
    }

    .mini-calendar-day.rejected {
      background: #ff1f1f;
      color: #ffffff;
      border-color: #ffd0d0;
      box-shadow: 0 0 14px rgba(255, 31, 31, 0.95);
    }

    .mini-calendar-day.selected {
      outline: 4px solid #ff6a00;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px rgba(255,106,0,0.55), 0 0 18px rgba(255,106,0,0.95);
    }

    .calendar-note {
      color: var(--text-soft);
      font-size: 10px;
      line-height: 1.15;
    }

    .header-panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-box {
      margin: 0 0 10px 0;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.2px;
      box-shadow: var(--neo-in);
      display: none;
    }

    .status-box.active {
      display: block;
    }

    .status-info {
      background: #1c1c1c;
      color: #dddddd;
    }

    .status-success {
      background: #11351d;
      color: #c8ffd4;
      border: 1px solid #39ff14;
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.45);
    }

    .status-error {
      background: #2a1118;
      color: #ffb6c9;
    }

    .save-toast {
      position: fixed !important;
      left: 50% !important;
      top: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) scale(0.96) !important;
      min-width: 260px;
      max-width: calc(100vw - 32px);
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-align: center;
      z-index: 999999 !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      box-shadow: 0 18px 42px rgba(0,0,0,0.68);
    }

    .save-toast.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) !important;
    }

    .save-toast.info {
      background: #1c1c1c;
      color: #eeeeee;
      border: 1px solid #555555;
    }

    .save-toast.success {
      background: #12a139;
      color: #ffffff;
      border: 1px solid #9dffb1;
      box-shadow: 0 0 22px rgba(57, 255, 20, 0.65), 0 16px 34px rgba(0,0,0,0.55);
    }

    .save-toast.error {
      background: #7d1225;
      color: #ffffff;
      border: 1px solid #ffb6c9;
    }

    .container {
      display: grid;
      gap: 10px;
      padding-bottom: 18px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px 0;
      padding: 0 0 10px 0;
      border-bottom: 1px solid #333333;
    }

    .bottom-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #333333;
    }

    .bottom-back-btn,
    .top-save-btn,
    .bottom-save-btn {
      width: min(260px, 100%);
      min-height: 46px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
    }

    .bottom-back-btn {
      background: linear-gradient(145deg, #4a4a4a, #1d1d1d);
      color: #d6d6d6;
      border: 1px solid #6a6a6a;
    }

    .top-save-btn {
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
      border: none;
    }

    .archiv-info-card {
      background: #151515;
      border-radius: 18px;
      padding: 10px;
      box-shadow: var(--neo-in);
      border: 1px solid #3d3d3d;
      display: grid;
      gap: 8px;
      opacity: 0.92;
    }

    .archive-chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(120, 120, 120, 0.18);
      border: 1px solid rgba(180, 180, 180, 0.5);
      color: #dddddd;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .job-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      display: grid;
      gap: 10px;
    }

    .job-card.zoll-abgelehnt,
    .archiv-info-card.zoll-abgelehnt,
    .archiv-info-card.minderausbeute {
      background: linear-gradient(135deg, rgba(120, 0, 0, 0.92), rgba(45, 0, 0, 0.96));
      border: 1px solid #ff4d4d;
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.35), var(--neo-out);
    }

    .reject-chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 0, 0, 0.22);
      border: 1px solid rgba(255, 110, 110, 0.9);
      color: #ffd6d6;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .reject-note {
      width: 100%;
      min-height: 54px;
      border-radius: 12px;
      border: 1px solid #4a4a4a;
      background: #101010;
      color: #ffffff;
      padding: 8px;
      resize: vertical;
    }

    .summary-line {
      display: grid;
      gap: 8px;
      align-items: center;
    }

    .summary-line.primary {
      grid-template-columns: minmax(0, 1fr) auto auto;
    }

    .summary-line.secondary {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .summary-line.actions {
      grid-template-columns: minmax(150px, 220px) minmax(0, 1fr);
      justify-content: stretch;
      align-items: start;
    }

    .save-group {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      justify-self: stretch;
      min-width: 0;
    }

    .owner-stack {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .owner-title {
      color: var(--pink);
      font-size: 16px;
      font-weight: 900;
      line-height: 1.15;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: anywhere;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.35);
    }

    .owner-subline {
      color: var(--text-soft);
      font-size: 11px;
      line-height: 1.25;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: anywhere;
    }

    .owner-description {
      margin-top: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      opacity: 0.95;
    }

    .status-chip,
    .done-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    .status-chip {
      background: rgba(255, 0, 127, 0.14);
      color: #ffd1e6;
      border: 1px solid rgba(255, 0, 127, 0.35);
    }

    .status-chip.ok {
      background: rgba(0, 255, 0, 0.12);
      color: #c6ffc6;
      border: 1px solid rgba(0, 255, 0, 0.35);
    }

    .done-chip {
      background: rgba(0, 255, 0, 0.12);
      color: #c6ffc6;
      border: 1px solid rgba(0, 255, 0, 0.35);
    }

    .mini-field {
      min-width: 0;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 6px 8px;
      display: grid;
      gap: 3px;
    }

    .mini-field.attention {
      background: rgba(0, 150, 255, 0.34);
      border-color: rgba(0, 195, 255, 1);
      box-shadow: 0 0 0 2px rgba(0,195,255,0.38), 0 0 18px rgba(0,195,255,0.32), inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .mini-field.attention .mini-field-label {
      color: #d9f5ff;
    }

    .mini-field.attention input {
      color: #ffffff;
    }

    .mini-field.ready {
      background: rgba(0, 255, 0, 0.08);
      border-color: rgba(0, 255, 0, 0.24);
    }

    .mini-field-label {
      color: var(--text-soft);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      line-height: 1;
    }

    .mini-field-value,
    .mini-field input {
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
      width: 100%;
      min-width: 0;
    }

    .mini-field input {
      background: transparent;
      border: none;
      padding: 0;
      outline: none;
      box-shadow: none;
    }

    .mini-field input[type="number"]::-webkit-outer-spin-button,
    .mini-field input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .mini-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 26px;
      width: auto;
      max-width: 132px;
      padding: 3px 6px;
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid #3a3a3a;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .mini-check input {
      width: 12px;
      height: 12px;
      accent-color: var(--neon);
      margin: 0;
      flex: 0 0 12px;
    }

    .mini-check.done-check {
      justify-self: end;
    }

    .mini-check.done-check span {
      order: 1;
    }

    .mini-check.done-check input {
      order: 2;
    }

    .btn-inline,
    .btn-inline-secondary {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1;
      width: 100%;
    }

    .btn-inline {
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
    }

    .btn-inline-secondary {
      background: #1f1f1f;
      color: var(--neon);
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.55);
    }

    .folder-top-btn {
      min-width: 42px;
      min-height: 32px;
      padding: 6px 10px;
      border: none;
      border-radius: 12px;
      background: #1f1f1f;
      color: var(--neon);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.55);
      white-space: nowrap;
    }

    .save-action-btn {
      justify-self: end;
      width: auto;
      min-width: 116px;
    }

    .save-group .save-action-btn {
      flex: 0 0 auto;
    }

    .summary-line.actions .btn-inline-secondary {
      justify-self: stretch;
      align-self: start;
    }

    .details-panel {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
      margin-top: 2px;
      position: relative;
      z-index: 1;
      clear: both;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
    }

    .details-panel.open {
      display: grid;
    }

    .detail-block {
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }

    .details-panel .mini-field-label {
      color: rgba(255, 255, 255, 0.78);
    }

    .detail-block.wide {
      grid-column: span 3;
    }

    .detail-value {
      color: #ffffff;
      font-size: 13px;
      line-height: 1.25;
      word-break: break-word;
    }

    .details-toggle-arrow {
      font-size: 18px;
      line-height: 0;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .zoll-line-compact {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
    }

    .zoll-line-compact input {
      width: 16px;
      height: 16px;
      accent-color: var(--neon);
      margin: 0;
    }

    .print-frame {
      width: 0;
      height: 0;
      border: 0;
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 19000;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--neo-out);
      border: 1px solid #3b3b3b;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #3b3b3b;

<body>
  <div class="main-frame">
    <div class="header-top">
      <div class="title-row">
        <h1 id="mainTitle">LEITSTAND</h1>
      </div>
      <div class="top-actions">
        <button class="top-action-btn protocol-btn" type="button" onclick="druckePaket()">BRENNPROTOKOLL</button>
        <button id="zollKontaktButton" class="top-action-btn zoll-btn" type="button" onclick="openZollKontakte(event)">ZOLL</button>
      </div>
    </div>

    <div class="header-panel">
      <div class="date-picker-block">
        <input type="hidden" id="tagPicker" value="">
        <div class="mini-calendar" id="brandtagCalendar">
          <div class="mini-calendar-head">
            <button class="mini-calendar-nav" type="button" onclick="wechselKalenderMonat(-1)">‹</button>
            <div class="mini-calendar-month" id="calendarMonthLabel">-</div>
            <button class="mini-calendar-nav" type="button" onclick="wechselKalenderMonat(1)">›</button>
          </div>
          <div class="mini-calendar-weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
          <div class="mini-calendar-days" id="calendarDays"></div>
          <div class="calendar-note">Neon grün = Brandtag vorhanden. Abgelehnte Brände werden nicht im Leitstand angezeigt. Daten werden erst nach Klick auf einen markierten Tag geladen.</div>
        </div>
      </div>
      <div class="header-panel-actions" aria-hidden="true"></div>
    </div>

    <div id="statusBox" class="status-box"></div>
    <div id="saveToast" class="save-toast" role="status" aria-live="polite"></div>
    <iframe id="printFrame" class="print-frame" title="Brennprotokoll-Druck"></iframe>

    <div class="container" id="jobList">
      
    </div>

    <div class="bottom-actions">
      <button class="bottom-save-btn" type="button" onclick="saveAllCards(this)">MARKIERTE SPEICHERN</button>
      <button class="bottom-back-btn" type="button" onclick="zurueckZurWebApp()">ZURÜCK ZUM HAUPTMENÜ</button>
    </div>
  </div>

  <div class="modal-backdrop" id="zollModal" onclick="handleModalBackdropClick(event)">
    <div class="modal-card">
      <div class="modal-head">
        <div id="zollModalTitle" class="modal-title">Zoll-Kontaktliste</div>
        <button class="modal-close" type="button" onclick="closeZollModal()">SCHLIESSEN</button>
      </div>
      <div class="modal-body">
        <div id="zollModalNote" style="margin-bottom:10px; color:#bbbbbb;"></div>
        <div class="zoll-list" id="zollListe"></div>
        <div class="zoll-summary" id="zollZusatz"></div>
        <div class="modal-actions">
          <button class="modal-btn" type="button" onclick="closeZollModal()">SCHLIESSEN</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const webAppUrl = <?= JSON.stringify(webAppUrl || '') ?>;
  const GITHUB_INDEX_URL = 'https://fraumecker.github.io/brennerei-startogv/';
  const GITHUB_ADMIN_URL = 'https://fraumecker.github.io/brennerei-startogv/admin.html';
  const returnModus = <?= JSON.stringify(typeof returnModus !== 'undefined' ? returnModus : '') ?>;
  const originModus = <?= JSON.stringify(typeof originModus !== 'undefined' ? originModus : '') ?>;
  const istAdminRuecksprung = <?= (typeof istAdminRuecksprung !== 'undefined' && istAdminRuecksprung) ? 'true' : 'false' ?>;
  const zollKontaktBootstrap = <?= (typeof zollKontaktlisteJson !== 'undefined' && zollKontaktlisteJson) ? zollKontaktlisteJson : 'null' ?>;
  let geplanteBrandtage = [];
  let offeneBrandtage = [];
  let fertigeBrandtage = [];
  let abgelehnteBrandtage = [];
  let kalenderDatum = new Date();
  let saveToastTimer = null;
  let leitstandRequestId = 0;

  window.onload = function() {
    ladeGeplanteBrandtage();
  };

  function ladeGeplanteBrandtage() {
    showToast('Leitstand wird geladen ...', 'success', 0);

    google.script.run
      .withSuccessHandler(function(daten) {
        if (Array.isArray(daten)) {
          geplanteBrandtage = daten.map(String);
          offeneBrandtage = daten.map(String);
          fertigeBrandtage = [];
          abgelehnteBrandtage = [];
        } else {
          geplanteBrandtage = Array.isArray(daten && daten.tage) ? daten.tage.map(String) : [];
          offeneBrandtage = Array.isArray(daten && daten.offen) ? daten.offen.map(String) : [];
          fertigeBrandtage = Array.isArray(daten && daten.fertig) ? daten.fertig.map(String) : [];
          abgelehnteBrandtage = Array.isArray(daten && daten.abgelehnt) ? daten.abgelehnt.map(String) : [];
        }
        setzeKalenderAufNaechstenGeplantenMonatOhneAuswahl();
        zeichneKalender();
        document.getElementById('jobList').innerHTML = '';
        showToast('Kalender geladen — Brandtag auswählen', 'success', 2800);
      })
      .withFailureHandler(function() {
        geplanteBrandtage = [];
        offeneBrandtage = [];
        fertigeBrandtage = [];
        abgelehnteBrandtage = [];
        setzeKalenderAufHeuteOhneAuswahl();
        zeichneKalender();
        document.getElementById('jobList').innerHTML = '';
        showToast('Kalender konnte nicht geladen werden', 'error', 4200);
      })
      .getLeitstandGeplanteBrandtage();
  }

  function aktualisiereKalenderdatenNachSpeichern() {
    const ausgewaehlt = document.getElementById('tagPicker').value;

    google.script.run
      .withSuccessHandler(function(daten) {
        if (Array.isArray(daten)) {
          geplanteBrandtage = daten.map(String);
          offeneBrandtage = daten.map(String);
          fertigeBrandtage = [];
          abgelehnteBrandtage = [];
        } else {
          geplanteBrandtage = Array.isArray(daten && daten.tage) ? daten.tage.map(String) : [];
          offeneBrandtage = Array.isArray(daten && daten.offen) ? daten.offen.map(String) : [];
          fertigeBrandtage = Array.isArray(daten && daten.fertig) ? daten.fertig.map(String) : [];
          abgelehnteBrandtage = Array.isArray(daten && daten.abgelehnt) ? daten.abgelehnt.map(String) : [];
        }

        if (ausgewaehlt && geplanteBrandtage.indexOf(String(ausgewaehlt)) !== -1) {
          document.getElementById('tagPicker').value = ausgewaehlt;
        }

        zeichneKalender();
        fetchJobs();
      })
      .withFailureHandler(function() {
        zeichneKalender();
        fetchJobs();
      })
      .getLeitstandGeplanteBrandtage();
  }

  function setzeKalenderAufNaechstenGeplantenMonatOhneAuswahl() {
    const heuteIso = isoVonDatum_(new Date());
    let zielIso = '';

    for (let i = 0; i < geplanteBrandtage.length; i++) {
      if (String(geplanteBrandtage[i]) >= heuteIso) {
        zielIso = String(geplanteBrandtage[i]);
        break;
      }
    }

    if (!zielIso && geplanteBrandtage.length) {
      zielIso = String(geplanteBrandtage[geplanteBrandtage.length - 1]);
    }

    document.getElementById('tagPicker').value = '';

    if (zielIso) {
      const teile = zielIso.split('-');
      kalenderDatum = new Date(Number(teile[0]), Number(teile[1]) - 1, 1);
    } else {
      setzeKalenderAufHeuteOhneAuswahl();
    }
  }

  function setzeKalenderAufHeuteOhneAuswahl() {
    const heute = new Date();
    document.getElementById('tagPicker').value = '';
    kalenderDatum = new Date(heute.getFullYear(), heute.getMonth(), 1);
  }

  function isoVonDatum_(datum) {
    return datum.getFullYear() + '-' + String(datum.getMonth() + 1).padStart(2, '0') + '-' + String(datum.getDate()).padStart(2, '0');
  }

  function handleDateInputChange() {
    const datum = document.getElementById('tagPicker').value;
    if (datum) {
      const teile = datum.split('-');
      if (teile.length === 3) {
        kalenderDatum = new Date(Number(teile[0]), Number(teile[1]) - 1, 1);
      }
    }
    zeichneKalender();
    fetchJobs();
  }

  function wechselKalenderMonat(delta) {
    kalenderDatum = new Date(kalenderDatum.getFullYear(), kalenderDatum.getMonth() + delta, 1);
    zeichneKalender();
  }

  function zeichneKalender() {
    const label = document.getElementById('calendarMonthLabel');
    const ziel = document.getElementById('calendarDays');
    if (!label || !ziel) return;

    const jahr = kalenderDatum.getFullYear();
    const monat = kalenderDatum.getMonth();
    const ausgewaehlt = document.getElementById('tagPicker').value;
    const monate = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    label.textContent = monate[monat] + ' ' + jahr;
    ziel.innerHTML = '';

    const erster = new Date(jahr, monat, 1);
    const letzterTag = new Date(jahr, monat + 1, 0).getDate();
    const startOffset = (erster.getDay() + 6) % 7;

    for (let i = 0; i < startOffset; i++) {
      const leer = document.createElement('button');
      leer.type = 'button';
      leer.className = 'mini-calendar-day empty';
      leer.tabIndex = -1;
      ziel.appendChild(leer);
    }

    for (let tag = 1; tag <= letzterTag; tag++) {
      const iso = jahr + '-' + String(monat + 1).padStart(2, '0') + '-' + String(tag).padStart(2, '0');
      const btn = document.createElement('button');
      btn.type = 'button';
      const istGeplant = geplanteBrandtage.indexOf(iso) !== -1;
      const istOffen = offeneBrandtage.indexOf(iso) !== -1;
      const istFertig = fertigeBrandtage.indexOf(iso) !== -1;
      const istAbgelehnt = abgelehnteBrandtage.indexOf(iso) !== -1;
      btn.className = 'mini-calendar-day'
        + ((istOffen || istFertig || (istGeplant && !istAbgelehnt)) ? ' planned' : '')
        + (iso === ausgewaehlt ? ' selected' : '');
      btn.textContent = String(tag);
      btn.onclick = function() {
        if (!istGeplant) {
          document.getElementById('tagPicker').value = '';
          document.getElementById('jobList').innerHTML = '';
          showToast('Für diesen Tag liegt kein Brandtag vor.', 'error', 3200);
          zeichneKalender();
          return;
        }
        showToast('Brandtag wird geladen ...', 'success', 0);
        document.getElementById('tagPicker').value = iso;
        fetchJobs();
        zeichneKalender();
      };
      ziel.appendChild(btn);
    }
  }

  function fetchJobs() {
    const datum = document.getElementById('tagPicker').value;
    const requestId = ++leitstandRequestId;
    const liste = document.getElementById('jobList');

    if (!datum || geplanteBrandtage.indexOf(String(datum)) === -1) {
      if (liste) liste.innerHTML = '';
      return;
    }

    showToast('Brandtag wird geladen ...', 'success', 0);

    if (liste) {
      liste.innerHTML = '<div class="archiv-info-card"><div class="archive-chip">LÄDT</div><div class="mini-field-value">Brandtag wird geladen ...</div></div>';
    }

    google.script.run
      .withSuccessHandler(function(payload) {
        if (requestId !== leitstandRequestId) return;
        drawJobs(payload);
        showToast('Brandtag geladen', 'success', 1600);
      })
      .withFailureHandler(function(err) {
        if (requestId !== leitstandRequestId) return;
        showServerError(err);
      })
      .getLeitstandData(datum);
  }

  function zurueckZurWebApp() {
    const ziel = istAdminRuecksprung ? GITHUB_ADMIN_URL : GITHUB_INDEX_URL;

    try {
      window.top.location.replace(ziel);
    } catch (e1) {
      try {
        window.open(ziel, '_top');
      } catch (e2) {
        window.location.href = ziel;
      }
    }
  }

  function drawJobs(res) {
    const cont = document.getElementById('jobList');
    cont.innerHTML = '';

    if (!res || !res.jobs || res.jobs.length === 0) {
      cont.innerHTML = '';
      return;
    }

    res.jobs.forEach(function(j, index) {
      if (j && j.archivInfo === true) {
        const infoCard = document.createElement('div');
        const archivAbgelehnt = j.zollAbgelehnt === true;
        const archivMinderausbeute = j.istMinderausbeute === true;
        infoCard.className = archivAbgelehnt ? 'archiv-info-card zoll-abgelehnt' : (archivMinderausbeute ? 'archiv-info-card minderausbeute' : 'archiv-info-card');
        infoCard.innerHTML = `
          <div class="summary-line primary">
            <div class="owner-stack">
              <div class="owner-title">${escapeHtml_(j.owner || '-')}</div>
              <div class="owner-subline">${archivAbgelehnt ? 'Abgelehnt' : (archivMinderausbeute ? 'Minderausbeute' : 'Gebrannt')} · Reg.-Nr. ${escapeHtml_(j.regNr || '-')} · Vorgang ${escapeHtml_(j.vId || '-')} · Fass: ${escapeHtml_(j.fassNr || '-')} · Inhalt: ${escapeHtml_(formatLiter_(j.inhalt))}</div>
              ${j.infoSystem ? `<div class="owner-description">${escapeHtml_(j.infoSystem)}</div>` : ''}
            </div>
            <button class="folder-top-btn" type="button" title="Ordner öffnen" aria-label="Ordner öffnen" onclick="openLinkSafe('${escapeJs_(j.link || '')}')">📁</button>
            <div class="${(archivAbgelehnt || archivMinderausbeute) ? 'reject-chip' : 'archive-chip'}">${archivAbgelehnt ? 'ABGELEHNT' : (archivMinderausbeute ? 'MINDERAUSBEUTE' : 'ARCHIV')}</div>
          </div>
          <div class="summary-line secondary">
            <div class="mini-field">
              <div class="mini-field-label">Von</div>
              <div class="mini-field-value">${escapeHtml_(j.von || '-')}</div>
            </div>
            <div class="mini-field">
              <div class="mini-field-label">Bis</div>
              <div class="mini-field-value">${escapeHtml_(j.bis || '-')}</div>
            </div>
            <div class="mini-field ready">
              <div class="mini-field-label">Alkohol</div>
              <div class="mini-field-value">${escapeHtml_(j.alk || '-')}</div>
            </div>
            <div class="mini-field ready">
              <div class="mini-field-label">Liter</div>
              <div class="mini-field-value">${escapeHtml_(j.ausbeute || '-')}</div>
            </div>
          </div>
        `;
        cont.appendChild(infoCard);
        return;
      }

      const card = document.createElement('div');
      const istZollAbgelehnt = j.zollAbgelehnt === true;
      card.className = istZollAbgelehnt ? 'job-card zoll-abgelehnt' : 'job-card';
      card.dataset.row = String(Number(j.row) || 0);
      card.dataset.vid = String(j.vId || '');
      const minderausbeuteChecked = j.istMinderausbeute ? 'checked' : '';
      const doneChip = j.istErledigt ? '<div class="done-chip">ERLEDIGT</div>' : '';
      const alkValue = String(j.alk || '').trim();
      const ausbeuteValue = String(j.ausbeute || '').trim();
      const alkFieldClass = alkValue ? 'mini-field ready' : 'mini-field attention';
      const ausbeuteFieldClass = ausbeuteValue ? 'mini-field ready' : 'mini-field attention';

      card.innerHTML = `
        <div class="summary-line primary">
          <div class="owner-stack">
            <div class="owner-title">${escapeHtml_(j.owner || '-')}</div>
            <div class="owner-subline">${escapeHtml_(j.brenner || 'Aktiv')} · Reg.-Nr. ${escapeHtml_(j.regNr || '-')} · Material: ${escapeHtml_(j.material || '-')} · Fass: ${escapeHtml_(j.fassNr || '-')} · Inhalt: ${escapeHtml_(formatLiter_(j.inhalt))}</div>
            ${j.infoSystem ? `<div class="owner-description">${escapeHtml_(j.infoSystem)}</div>` : ''}
          </div>
          <button class="folder-top-btn" type="button" title="Ordner öffnen" aria-label="Ordner öffnen" onclick="openLinkSafe('${escapeJs_(j.link || '')}')">📁</button>
          ${doneChip || '<div></div>'}
        </div>

        <div class="summary-line secondary">
          <div class="mini-field">
            <div class="mini-field-label">Von</div>
            <div class="mini-field-value">${escapeHtml_(j.von || '-')}</div>
          </div>
          <div class="mini-field">
            <div class="mini-field-label">Bis</div>
            <div class="mini-field-value">${escapeHtml_(j.bis || '-')}</div>
          </div>
          <div class="${alkFieldClass}">
            <div class="mini-field-label">Alkohol</div>
            <input type="number" step="0.01" value="${escapeAttr_(j.alk || '')}" data-role="alkohol" placeholder="ausfüllen">
          </div>
          <div class="${ausbeuteFieldClass}">
            <div class="mini-field-label">Liter</div>
            <input type="number" step="0.01" value="${escapeAttr_(j.ausbeute || '')}" data-role="ausbeute" placeholder="ausfüllen">
          </div>
        </div>

        <div class="summary-line actions">
          <button class="btn-inline-secondary" type="button" onclick="toggleDetails(this)"><span class="details-toggle-arrow">＋</span>DETAILS</button>
          <div class="save-group">
            <label class="mini-check"><input type="checkbox" ${minderausbeuteChecked} data-role="minderausbeute" onchange="handleMinderausbeuteChange(this)"><span>Minderausbeute melden</span></label>
            <label class="mini-check"><input type="checkbox" data-role="zumSpeichern"><span>Diese Zeile übernehmen</span></label>
          </div>
        </div>

        <div class="details-panel">
          <div class="detail-block">
            <div class="mini-field-label">Registernummer</div>
            <div class="detail-value">${escapeHtml_(j.regNr || '-')}</div>
          </div>
          <div class="detail-block">
            <div class="mini-field-label">Material</div>
            <div class="detail-value">${escapeHtml_(j.material || '-')}</div>
          </div>
          <div class="detail-block">
            <div class="mini-field-label">Fassnummer</div>
            <div class="detail-value">${escapeHtml_(j.fassNr || '-')}</div>
          </div>
          <div class="detail-block">
            <div class="mini-field-label">Inhalt in Liter</div>
            <div class="detail-value">${escapeHtml_(formatLiter_(j.inhalt))}</div>
          </div>
          <div class="detail-block">
            <div class="mini-field-label">Faßgröße</div>
            <div class="detail-value">${escapeHtml_(j.fassgroesse || '-')}</div>
          </div>
          <div class="detail-block wide">
            <div class="mini-field-label">Gewürze</div>
            <div class="detail-value">${escapeHtml_(j.gewuerze || '-')}</div>
          </div>
        </div>
      `;
      cont.appendChild(card);
    });
  }



  function toggleDetails(button) {
    const card = button ? button.closest('.job-card') : null;
    const panel = card ? card.querySelector('.details-panel') : null;

    if (!panel) {
      showStatus('Details konnten nicht geöffnet werden: Detailbereich nicht gefunden.', 'error');
      return;
    }

    const wirdGeoeffnet = !panel.classList.contains('open');
    panel.classList.toggle('open', wirdGeoeffnet);

    if (button) {
      button.setAttribute('aria-expanded', wirdGeoeffnet ? 'true' : 'false');
      const arrow = button.querySelector('.details-toggle-arrow');
      if (arrow) {
        arrow.textContent = wirdGeoeffnet ? '−' : '＋';
      }
    }
  }

  function toggleAblehnungBemerkung(checkbox) {
    const card = checkbox ? checkbox.closest('.job-card') : null;
    const block = card ? card.querySelector('[data-role="ablehnungBemerkungBlock"]') : null;
    const panel = card ? card.querySelector('.details-panel') : null;
    if (block) block.style.display = checkbox.checked ? 'block' : 'none';
    if (panel && checkbox.checked) panel.classList.add('open');
  }

  function handleMinderausbeuteChange(checkbox) {
    const card = checkbox ? checkbox.closest('.job-card') : null;
    if (!card) return;

    const ausbeuteFeld = card.querySelector('[data-role="ausbeute"]');
    const alkoholFeld = card.querySelector('[data-role="alkohol"]');
    const speichernFeld = card.querySelector('[data-role="zumSpeichern"]');

    if (checkbox.checked) {
      if (ausbeuteFeld) ausbeuteFeld.value = '0';
      if (alkoholFeld) alkoholFeld.value = '0';
      if (speichernFeld) speichernFeld.checked = true;
    }
  }

  function lesePayloadAusKarte(card) {
    return {
      row: Number(card && card.dataset ? card.dataset.row : 0) || 0,
      vId: card && card.dataset ? String(card.dataset.vid || '') : '',
      alkohol: leseFeldwert(card, 'alkohol'),
      ausbeute: leseFeldwert(card, 'ausbeute'),
      erledigt: true,
      minderausbeute: leseCheckbox(card, 'minderausbeute'),
      zollAbgelehnt: false,
      ablehnungBemerkung: ''
    };
  }

  function saveAllCards(button) {
    showToast('Speicherung wird geprüft ...', 'success', 0);
    const cards = Array.prototype.slice.call(document.querySelectorAll('.job-card'));

    if (!cards.length) {
      showStatus('Keine Vorgänge zum Speichern vorhanden.', 'error');
      return;
    }

    const markierteCards = cards.filter(function(card) {
      return leseCheckbox(card, 'zumSpeichern');
    });

    if (!markierteCards.length) {
      showStatus('Keine Zeile markiert. Bitte bei den fertigen Zeilen „Übernehmen“ anhaken.', 'error');
      return;
    }

    const payloads = markierteCards.map(lesePayloadAusKarte).filter(function(payload) {
      const hatEingabe = String(payload.alkohol || '').trim()
        || String(payload.ausbeute || '').trim()
        || payload.minderausbeute === true;
      return (payload.row || payload.vId) && hatEingabe;
    });

    if (!payloads.length) {
      showStatus('Markierte Zeilen haben keine Eingaben. Nicht markierte Vorgänge bleiben offen.', 'error');
      return;
    }

    setBusy(true, button, 'Speichere ...');
    showToast('Markierte Zeilen werden gespeichert ...', 'success', 0);

    google.script.run
      .withSuccessHandler(function(res) {
        setBusy(false, button);
        const gespeichert = res && typeof res.gespeichert !== 'undefined' ? Number(res.gespeichert) || 0 : 0;
        const teilgespeichert = res && typeof res.teilgespeichert !== 'undefined' ? Number(res.teilgespeichert) || 0 : 0;
        const abgelehnt = res && typeof res.abgelehnt !== 'undefined' ? Number(res.abgelehnt) || 0 : 0;
        const uebersprungen = res && typeof res.uebersprungen !== 'undefined' ? Number(res.uebersprungen) || 0 : 0;
        const archiviert = res && typeof res.archiviert !== 'undefined' ? Number(res.archiviert) || 0 : 0;

        showStatus(
          'Markierte Zeilen gespeichert. Vollständig: ' + gespeichert +
          ' | Teilgespeichert: ' + teilgespeichert +
          ' | Abgelehnt: ' + abgelehnt +
          ' | Übersprungen: ' + uebersprungen +
          ' | Archiviert: ' + archiviert + '.',
          'success'
        );
        showToast('Speicherung erfolgreich', 'success', 3200);
        aktualisiereKalenderdatenNachSpeichern();
      })
      .withFailureHandler(function(err) {
        setBusy(false, button);
        const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
        showStatus('Speichern nicht möglich: ' + msg, 'error');
        showToast('Speichern nicht möglich', 'error', 4200);
        fetchJobs();
      })
      .saveLeitstandEintraegeBatch(payloads);
  }


  function druckePaket() {
    const datum = document.getElementById('tagPicker').value;
    if (!datum) {
      showStatus('Bitte zuerst einen Brandtag im Kalender auswählen.', 'error');
      return;
    }

    // Wichtig bei GitHub/iframe: Fenster sofort im echten Button-Klick öffnen.
    // Öffnen erst im google.script.run-Success wird von Browsern oft als Popup blockiert.
    let printWin = null;
    try {
      printWin = window.open('', 'brennprotokoll_print');
      if (printWin) {
        printWin.document.open();
        printWin.document.write('<html><head><title>Brennprotokoll</title></head><body style="font-family:Segoe UI,Arial,sans-serif;padding:24px;">Brennprotokoll wird geladen ...</body></html>');
        printWin.document.close();
      }
    } catch (e) {
      printWin = null;
    }

    showStatus('Brennprotokoll wird geladen ...', 'info');
    google.script.run
      .withSuccessHandler(function(html) {
        html = html || '<html><body>Kein Brennprotokoll erzeugt.</body></html>';

        if (printWin && !printWin.closed) {
          try {
            printWin.document.open();
            printWin.document.write(html);
            printWin.document.close();
            printWin.focus();
            setTimeout(function() {
              try {
                printWin.print();
                showStatus('Brennprotokoll geöffnet.', 'info');
              } catch (e) {
                showStatus('Brennprotokoll geöffnet. Bitte im Fenster manuell drucken.', 'info');
              }
            }, 450);
            return;
          } catch (e) {
            // Fallback unten
          }
        }

        const frame = document.getElementById('printFrame');
        if (!frame || !frame.contentWindow) {
          showStatus('Popup wurde blockiert. Bitte Popups für diese Seite erlauben und erneut klicken.', 'error');
          return;
        }

        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        if (!frameDoc) {
          showStatus('Druckfenster konnte nicht geöffnet werden.', 'error');
          return;
        }

        frameDoc.open();
        frameDoc.write(html);
        frameDoc.close();

        setTimeout(function() {
          try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
            showStatus('Brennprotokoll geöffnet.', 'info');
          } catch (e) {
            showStatus('Brennprotokoll geladen, Druckdialog konnte nicht automatisch geöffnet werden.', 'error');
          }
        }, 450);
      })
      .withFailureHandler(function(err) {
        const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
        if (printWin && !printWin.closed) {
          try {
            printWin.document.open();
            printWin.document.write('<html><body style="font-family:Segoe UI,Arial,sans-serif;padding:24px;color:#b00020;">Brennprotokoll konnte nicht geladen werden:<br><br>' + escapeHtml_(msg) + '</body></html>');
            printWin.document.close();
          } catch (e) {}
        }
        showStatus('Brennprotokoll konnte nicht geladen werden: ' + msg, 'error');
      })
      .getProtokollHtmlFuerBrandtag(datum);
  }

  function openLinkSafe(url) {
    if (!url) return;
    window.open(url, '_blank');
  }

  let zollKontaktPayload = null;
  let zollKontaktLaedt = false;

  function normalisiereZollKontakt_(kontakt) {
    kontakt = kontakt || {};
    return {
      name: kontakt.name || kontakt.Name || kontakt.ansprechpartner || kontakt.Ansprechpartner || kontakt.person || kontakt.Person || '',
      dienstsitz: kontakt.dienstsitz || kontakt.Dienstsitz || kontakt.standort || kontakt.Standort || kontakt.ort || kontakt.Ort || '-',
      telefon: kontakt.telefon || kontakt.Telefon || kontakt.tel || kontakt.Tel || kontakt.festnetz || kontakt.Festnetz || '',
      mobil: kontakt.mobil || kontakt.Mobil || kontakt.handy || kontakt.Handy || kontakt.mobile || kontakt.Mobile || '',
      email: kontakt.email || kontakt.Email || kontakt.eMail || kontakt['E-Mail'] || kontakt.mail || kontakt.Mail || ''
    };
  }

  function normalisiereZollPayload_(daten) {
    if (Array.isArray(daten)) {
      return {
        titel: 'Zoll-Kontaktliste',
        untertitel: 'Zentrale Kontaktliste',
        stand: '',
        faxAlleStandorte: '',
        zentraleEmail: '',
        kontakte: daten.map(normalisiereZollKontakt_)
      };
    }

    if (daten && typeof daten === 'object') {
      const kontakte = Array.isArray(daten.kontakte) ? daten.kontakte : (Array.isArray(daten.Kontakte) ? daten.Kontakte : []);
      return {
        titel: daten.titel || daten.Titel || 'Zoll-Kontaktliste',
        untertitel: daten.untertitel || daten.Untertitel || 'Zentrale Kontaktliste',
        stand: daten.stand || daten.Stand || '',
        faxAlleStandorte: daten.faxAlleStandorte || daten.FaxAlleStandorte || daten.fax || daten.Fax || '',
        zentraleEmail: daten.zentraleEmail || daten.ZentraleEmail || daten.email || daten.Email || '',
        kontakte: kontakte.map(normalisiereZollKontakt_)
      };
    }

    return {
      titel: 'Zoll-Kontaktliste',
      untertitel: 'Keine gültigen Daten erhalten.',
      stand: '',
      faxAlleStandorte: '',
      zentraleEmail: '',
      kontakte: []
    };
  }

  function openZollKontakte(event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    if (event && typeof event.stopPropagation === 'function') event.stopPropagation();

    // Beim Öffnen immer nach oben scrollen damit das Modal sichtbar ist
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}
    try { window.top.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}

    // Bereits gecachte Kontakte sofort anzeigen
    if (zollKontaktPayload && Array.isArray(zollKontaktPayload.kontakte) && zollKontaktPayload.kontakte.length) {
      showZollKontaktModal(zollKontaktPayload, true);
      showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
      return;
    }

    // Beim Bootstrap bereits mitgelieferte Daten (vom Server beim Seitenaufruf)
    if (zollKontaktBootstrap) {
      const bootstrapPayload = normalisiereZollPayload_(zollKontaktBootstrap);
      if (bootstrapPayload.kontakte.length) {
        zollKontaktPayload = bootstrapPayload;
        showZollKontaktModal(bootstrapPayload, true);
        showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
        return;
      }
      if (zollKontaktBootstrap.fehler) {
        showToast('Zoll-Kontaktliste konnte nicht geladen werden', 'error', 4200);
        setZollModalFehler_('Zoll-Kontaktliste konnte nicht geladen werden: ' + zollKontaktBootstrap.fehler);
        return;
      }
    }

    // Kein google.script.run verfügbar (z.B. beim Direktaufruf außerhalb der Apps-Script-WebApp)
    if (!window.google || !window.google.script || !window.google.script.run) {
      showToast('Zoll-Kontaktliste: Direkt-Aufruf außerhalb der WebApp', 'error', 5000);
      setZollModalFehler_(
        'Zoll-Kontaktliste kann hier nicht nachgeladen werden. ' +
        'Öffne den Leitstand über die Apps-Script-Web-App ' +
        '(nicht direkt über GitHub), damit die Kontakte automatisch beim Laden mitgeliefert werden.'
      );
      return;
    }

    // Nur ein paralleler Ladevorgang
    if (zollKontaktLaedt) return;
    zollKontaktLaedt = true;

    showToast('Zoll-Kontaktliste wird geladen ...', 'success', 0);
    showZollKontaktModal({
      titel: 'Zoll-Kontaktliste',
      untertitel: 'Wird geladen ...',
      stand: '', faxAlleStandorte: '', zentraleEmail: '', kontakte: []
    }, true);

    google.script.run
      .withSuccessHandler(function(daten) {
        zollKontaktLaedt = false;
        const payload = normalisiereZollPayload_(daten);
        zollKontaktPayload = payload;
        if (!payload.kontakte.length) {
          setZollModalFehler_('Zoll-Kontaktliste geladen, aber keine Kontakte vorhanden.');
          showToast('Zoll-Liste leer', 'error', 4200);
          return;
        }
        showZollKontaktModal(payload, true);
        showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
      })
      .withFailureHandler(function(err) {
        zollKontaktLaedt = false;
        const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
        showToast('Zoll-Kontaktliste konnte nicht geladen werden', 'error', 4200);
        setZollModalFehler_('Fehler beim Laden: ' + msg);
      })
      .getZollNotfallKontaktliste();
  }

  function showZollKontaktModal(payload, offenHalten) {
    zollKontaktPayload = payload || null;

    const modal = document.getElementById('zollModal');
    const titel = document.getElementById('zollModalTitle');
    const note = document.getElementById('zollModalNote');
    const liste = document.getElementById('zollListe');
    const zusatz = document.getElementById('zollZusatz');

    if (!modal || !titel || !note || !liste || !zusatz) {
      showStatus('Zoll-Kontaktliste konnte nicht geöffnet werden: Modal fehlt im Leitstand.', 'error');
      return;
    }

    if (!payload || !Array.isArray(payload.kontakte)) {
      modal.classList.add('active');
      setZollModalFehler_('Zoll-Kontaktliste konnte nicht geladen werden: Serverantwort ungültig.');
      showStatus('Zoll-Kontaktliste konnte nicht geladen werden: Serverantwort ungültig.', 'error');
      return;
    }

    titel.textContent = payload.titel || 'Zoll-Kontaktliste';
    note.textContent = payload.untertitel || 'Nur Anzeige der hinterlegten Zoll-Liste.';

    if (!payload.kontakte.length) {
      liste.innerHTML = '<div class="zoll-row"><div class="zoll-name">Kontaktliste wird geladen ...</div></div>';
    } else {
      liste.innerHTML = payload.kontakte.map(function(k) {
        return '<div class="zoll-row">'
          + '<div class="zoll-name">👤 ' + escapeHtml_(k.name || '') + '</div>'
          + '<div class="zoll-meta">🏢 ' + escapeHtml_(k.dienstsitz || '-') + '</div>'
          + '<div class="zoll-line">📞 Telefon: ' + linkHtml(k.telefon, 'tel') + '</div>'
          + '<div class="zoll-line">📱 Mobil: ' + linkHtml(k.mobil, 'tel') + '</div>'
          + '<div class="zoll-line">✉️ E-Mail: ' + linkHtml(k.email, 'mail') + '</div>'
          + '</div>';
      }).join('');
    }

    zusatz.innerHTML = ''
      + '<div class="zoll-summary-item"><strong>Stand:</strong> ' + escapeHtml_(payload.stand || '-') + '</div>'
      + '<div class="zoll-summary-item"><strong>Fax alle Standorte:</strong> ' + escapeHtml_(payload.faxAlleStandorte || '-') + '</div>'
      + '<div class="zoll-summary-item"><strong>Zentrale E-Mail:</strong> ' + linkHtml(payload.zentraleEmail || '-', 'mail') + '</div>';

    modal.classList.add('active');
    if (!offenHalten) showStatus('Zoll-Kontaktliste geöffnet.', 'info');
  }

  function setZollModalFehler_(text) {
    const modal = document.getElementById('zollModal');
    const note = document.getElementById('zollModalNote');
    const liste = document.getElementById('zollListe');
    const zusatz = document.getElementById('zollZusatz');
    if (modal) modal.classList.add('active');
    if (note) note.textContent = 'Fehler';
    if (liste) liste.innerHTML = '<div class="zoll-row"><div class="zoll-name">' + escapeHtml_(text || 'Unbekannter Fehler') + '</div></div>';
    if (zusatz) zusatz.innerHTML = '';
  }

  function closeZollModal() {
    document.getElementById('zollModal').classList.remove('active');
  }

  function leseFeldwert(card, role) {
    const feld = card.querySelector('[data-role="' + role + '"]');
    return feld ? feld.value : '';
  }

  function leseCheckbox(card, role) {
    const feld = card.querySelector('[data-role="' + role + '"]');
    return !!(feld && feld.checked);
  }

  function istZollGenehmigt(text) {
    return String(text || '').toUpperCase().indexOf('GENEHMIGT') !== -1 || String(text || '').toUpperCase().indexOf('ZOLL_OK') !== -1;
  }

  function linkHtml(wert, typ) {
    const text = String(wert || '').trim();
    if (!text || text === '-') return '-';

    if (typ === 'mail') {
      return '<a href="mailto:' + escapeAttr_(text) + '">' + escapeHtml_(text) + '</a>';
    }

    const tel = text.replace(/[^\d+]/g, '');
    if (!tel) return escapeHtml_(text);
    return '<a href="tel:' + escapeAttr_(tel) + '">' + escapeHtml_(text) + '</a>';
  }

  function handleModalBackdropClick(event) {
    if (event.target && event.target.id === 'zollModal') {
      closeZollModal();
    }
  }

  function formatLiter_(wert) {
    const text = String(wert || '').trim();
    if (!text) return '-';
    return /liter|litre| l$/i.test(text) ? text : text + ' Liter';
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeHtml_(text) {
    return escapeHtml(text);
  }

  function escapeAttr_(text) {
    return escapeHtml(text);
  }

  function escapeJs_(text) {
    return String(text || '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '')
      .replace(/\n/g, ' ')
      .replace(/</g, '\\x3C')
      .replace(/>/g, '\\x3E');
  }

  function showServerError(err) {
    const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
    showStatus(msg, 'error');
  }

  function showStatus(message, type) {
    const box = document.getElementById('statusBox');
    const text = message || '';

    if (box) {
      box.textContent = '';
      box.className = 'status-box';
      box.style.display = 'none';
    }

    if (text) {
      const dauer = type === 'error' ? 5200 : (type === 'success' ? 3200 : 0);
      showToast(text, type, dauer);
    }
  }

  function showToast(message, type, durationMs) {
    const toast = document.getElementById('saveToast');
    if (!toast) return;

    if (saveToastTimer) {
      clearTimeout(saveToastTimer);
      saveToastTimer = null;
    }

    toast.textContent = message || '';
    toast.className = 'save-toast active ' + (type === 'success' ? 'success' : (type === 'error' ? 'error' : 'info'));

    if (durationMs && durationMs > 0) {
      saveToastTimer = setTimeout(function() {
        toast.className = 'save-toast';
      }, durationMs);
    }
  }

  function setBusy(isBusy, button, busyText) {
    if (!button) return;
    if (isBusy) {
      button.disabled = true;
      button.dataset.originalText = button.textContent;
      button.textContent = busyText || 'Bitte warten ...';
    } else {
      button.disabled = false;
      button.textContent = button.dataset.originalText || button.textContent;
    }
  }

  window.openZollKontakte = openZollKontakte;
  window.closeZollModal = closeZollModal;
  window.handleModalBackdropClick = handleModalBackdropClick;
  window.toggleDetails = toggleDetails;

</script>
