      { name: 'Weber', dienstsitz: 'PS', telefon: '06331/5538-17', mobil: '0171-5418967', email: 'jens.weber@zoll.bund.de' }
    ]
  };
  let geplanteBrandtage = [];
  let offeneBrandtage = [];
  let fertigeBrandtage = [];
  let abgelehnteBrandtage = [];
  let kalenderDatum = new Date();
  let saveToastTimer = null;
  let leitstandRequestId = 0;
  let aktuelleLeitstandJobs = [];
  let aktuelleLeitstandGruppen = [];
  let aktiveLeitstandGruppe = null;

  window.onload = function() {
    ladeGeplanteBrandtage();
  };

  function ladeGeplanteBrandtage() {
    showToast('Leitstand wird geladen ...', 'success', 0);

    google.script.run
      .withSuccessHandler(function(daten) {
        if (Array.isArray(daten)) {
          geplanteBrandtage = daten.map(String);
          offeneBrandtage = daten.map(String);
          fertigeBrandtage = [];
          abgelehnteBrandtage = [];
        } else {
          geplanteBrandtage = Array.isArray(daten && daten.tage) ? daten.tage.map(String) : [];
          offeneBrandtage = Array.isArray(daten && daten.offen) ? daten.offen.map(String) : [];
          fertigeBrandtage = Array.isArray(daten && daten.fertig) ? daten.fertig.map(String) : [];
          abgelehnteBrandtage = Array.isArray(daten && daten.abgelehnt) ? daten.abgelehnt.map(String) : [];
        }
        setzeKalenderAufNaechstenGeplantenMonatOhneAuswahl();
        zeichneKalender();
        document.getElementById('jobList').innerHTML = '';
        showToast('', 'info', 0);
      })
      .withFailureHandler(function() {
        geplanteBrandtage = [];
        offeneBrandtage = [];
        fertigeBrandtage = [];
        abgelehnteBrandtage = [];
        setzeKalenderAufHeuteOhneAuswahl();
        zeichneKalender();
        document.getElementById('jobList').innerHTML = '';
        showToast('', 'info', 0);
      })
      .getLeitstandGeplanteBrandtage();
  }

  function aktualisiereKalenderdatenNachSpeichern() {
    const ausgewaehlt = document.getElementById('tagPicker').value;

    google.script.run
      .withSuccessHandler(function(daten) {
        if (Array.isArray(daten)) {
          geplanteBrandtage = daten.map(String);
          offeneBrandtage = daten.map(String);
          fertigeBrandtage = [];
          abgelehnteBrandtage = [];
        } else {
          geplanteBrandtage = Array.isArray(daten && daten.tage) ? daten.tage.map(String) : [];
          offeneBrandtage = Array.isArray(daten && daten.offen) ? daten.offen.map(String) : [];
          fertigeBrandtage = Array.isArray(daten && daten.fertig) ? daten.fertig.map(String) : [];
          abgelehnteBrandtage = Array.isArray(daten && daten.abgelehnt) ? daten.abgelehnt.map(String) : [];
        }

        if (ausgewaehlt && geplanteBrandtage.indexOf(String(ausgewaehlt)) !== -1) {
          document.getElementById('tagPicker').value = ausgewaehlt;
        }

        zeichneKalender();
        fetchJobs();
      })
      .withFailureHandler(function() {
        zeichneKalender();
        fetchJobs();
      })
      .getLeitstandGeplanteBrandtage();
  }

  function setzeKalenderAufNaechstenGeplantenMonatOhneAuswahl() {
    const heuteIso = isoVonDatum_(new Date());
    let zielIso = '';

    for (let i = 0; i < geplanteBrandtage.length; i++) {
      if (String(geplanteBrandtage[i]) >= heuteIso) {
        zielIso = String(geplanteBrandtage[i]);
        break;
      }
    }

    if (!zielIso && geplanteBrandtage.length) {
      zielIso = String(geplanteBrandtage[geplanteBrandtage.length - 1]);
    }

    document.getElementById('tagPicker').value = '';

    if (zielIso) {
      const teile = zielIso.split('-');
      kalenderDatum = new Date(Number(teile[0]), Number(teile[1]) - 1, 1);
    } else {
      setzeKalenderAufHeuteOhneAuswahl();
    }
  }

  function setzeKalenderAufHeuteOhneAuswahl() {
    const heute = new Date();
    document.getElementById('tagPicker').value = '';
    kalenderDatum = new Date(heute.getFullYear(), heute.getMonth(), 1);
  }

  function isoVonDatum_(datum) {
    return datum.getFullYear() + '-' + String(datum.getMonth() + 1).padStart(2, '0') + '-' + String(datum.getDate()).padStart(2, '0');
  }

  function handleDateInputChange() {
    const datum = document.getElementById('tagPicker').value;
    if (datum) {
      const teile = datum.split('-');
      if (teile.length === 3) {
        kalenderDatum = new Date(Number(teile[0]), Number(teile[1]) - 1, 1);
      }
    }
    zeichneKalender();
    fetchJobs();
  }

  function wechselKalenderMonat(delta) {
    kalenderDatum = new Date(kalenderDatum.getFullYear(), kalenderDatum.getMonth() + delta, 1);
    zeichneKalender();
  }

  function zeichneKalender() {
    const label = document.getElementById('calendarMonthLabel');
    const ziel = document.getElementById('calendarDays');
    if (!label || !ziel) return;

    const jahr = kalenderDatum.getFullYear();
    const monat = kalenderDatum.getMonth();
    const ausgewaehlt = document.getElementById('tagPicker').value;
    const monate = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    label.textContent = monate[monat] + ' ' + jahr;
    ziel.innerHTML = '';

    const erster = new Date(jahr, monat, 1);
    const letzterTag = new Date(jahr, monat + 1, 0).getDate();
    const startOffset = (erster.getDay() + 6) % 7;

    for (let i = 0; i < startOffset; i++) {
      const leer = document.createElement('button');
      leer.type = 'button';
      leer.className = 'mini-calendar-day empty';
      leer.tabIndex = -1;
      ziel.appendChild(leer);
    }

    for (let tag = 1; tag <= letzterTag; tag++) {
      const iso = jahr + '-' + String(monat + 1).padStart(2, '0') + '-' + String(tag).padStart(2, '0');
      const btn = document.createElement('button');
      btn.type = 'button';
      const istGeplant = geplanteBrandtage.indexOf(iso) !== -1;
      const istOffen = offeneBrandtage.indexOf(iso) !== -1;
      const istFertig = fertigeBrandtage.indexOf(iso) !== -1;
      const istAbgelehnt = abgelehnteBrandtage.indexOf(iso) !== -1;
      btn.className = 'mini-calendar-day'
        + ((istOffen || istFertig || (istGeplant && !istAbgelehnt)) ? ' planned' : '')
        + (iso === ausgewaehlt ? ' selected' : '');
      btn.textContent = String(tag);
      btn.onclick = function() {
        if (!istGeplant) {
          document.getElementById('tagPicker').value = '';
          document.getElementById('jobList').innerHTML = '';
          showToast('Für diesen Tag liegt kein Brandtag vor.', 'error', 3200);
          zeichneKalender();
          return;
        }
        showToast('Brandtag wird geladen ...', 'success', 0);
        document.getElementById('tagPicker').value = iso;
        fetchJobs();
        zeichneKalender();
      };
      ziel.appendChild(btn);
    }
  }

  function fetchJobs() {
    const datum = document.getElementById('tagPicker').value;
    const requestId = ++leitstandRequestId;
    const liste = document.getElementById('jobList');

    if (!datum || geplanteBrandtage.indexOf(String(datum)) === -1) {
      if (liste) liste.innerHTML = '';
      return;
    }

    if (liste) {
      liste.innerHTML = '<div class="archiv-info-card"><div class="archive-chip">LÄDT</div><div class="mini-field-value">Brandtag wird geladen ...</div></div>';
    }

    google.script.run
      .withSuccessHandler(function(payload) {
        if (requestId !== leitstandRequestId) return;
        drawJobs(payload);
        showToast('Brandtag geladen', 'success', 1600);
      })
      .withFailureHandler(function(err) {
        if (requestId !== leitstandRequestId) return;
        showServerError(err);
      })
      .getLeitstandData(datum);
  }

  function zurueckZurWebApp() {
    const ziel = istAdminRuecksprung ? GITHUB_ADMIN_URL : GITHUB_INDEX_URL;

    try {
      window.top.location.replace(ziel);
    } catch (e1) {
      try {
        window.open(ziel, '_top');
      } catch (e2) {
        window.location.href = ziel;
      }
    }
  }

  function drawJobs(res) {
    const cont = document.getElementById('jobList');
    const dayList = document.getElementById('dayBrandList');
    const protocolPreview = document.getElementById('protocolPreviewCard');

    if (cont) cont.innerHTML = '';
    if (dayList) dayList.innerHTML = '';
    if (protocolPreview) protocolPreview.innerHTML = '';

    aktuelleLeitstandJobs = Array.isArray(res && res.jobs) ? res.jobs : [];

    if (!res || !res.jobs || res.jobs.length === 0) {
      if (cont) cont.innerHTML = '<div class="empty-leitstand">Für den ausgewählten Tag wurden keine Leitstand-Einträge gefunden.</div>';
      if (dayList) dayList.innerHTML = '<div class="day-brand-meta">Keine Brände geladen.</div>';
      zeichneProtokollVorschau(null);
      return;
    }

    const gruppen = gruppiereLeitstandJobs_(res.jobs);
    aktuelleLeitstandGruppen = gruppen;
    aktiveLeitstandGruppe = null;

    if (!gruppen.length) {
      if (cont) cont.innerHTML = '<div class="empty-leitstand">Für den ausgewählten Tag wurden keine auswertbaren Leitstand-Einträge gefunden.</div>';
      if (dayList) dayList.innerHTML = '<div class="day-brand-meta">Keine Brände geladen.</div>';
      zeichneProtokollVorschau(null);
      return;
    }

    gruppen.forEach(function(gruppe, index) {
      if (dayList) dayList.appendChild(baueTageslistenKarte_(gruppe, index));
    });

    if (cont) cont.innerHTML = '<div class="empty-leitstand">Bitte links bei „Brände am Tag“ einen Brand auswählen.</div>';
    zeichneProtokollVorschau(gruppen);
  }

  function gruppiereLeitstandJobs_(jobs) {
    const map = {};
    const gruppen = [];

    (jobs || []).forEach(function(j) {
      const schluessel = [
        j && j.vId ? String(j.vId) : '',
        j && j.von ? String(j.von) : '',
        j && j.bis ? String(j.bis) : '',
        j && j.owner ? String(j.owner) : '',
        j && j.regNr ? String(j.regNr) : '',
        j && j.archivInfo ? 'archiv' : 'offen'
      ].join('||');

      if (!map[schluessel]) {
        map[schluessel] = {
          key: schluessel,
          jobs: [],
          first: j || {},
          archivInfo: !!(j && j.archivInfo === true)
        };
        gruppen.push(map[schluessel]);
      }
      map[schluessel].jobs.push(j || {});
    });

    gruppen.sort(function(a, b) {
      const archivA = a.archivInfo ? 1 : 0;
      const archivB = b.archivInfo ? 1 : 0;
      if (archivA !== archivB) return archivA - archivB;
      return String(a.first.von || '').localeCompare(String(b.first.von || ''));
    });

    return gruppen;
  }

  function baueTageslistenKarte_(gruppe, index) {
    const j = gruppe.first || {};
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'day-brand-card';
    button.dataset.groupIndex = String(index);
    button.onclick = function() {
      document.querySelectorAll('.day-brand-card').forEach(function(el) { el.classList.remove('active'); });
      button.classList.add('active');
      zeichneAktiveGruppe_(gruppe, index);
    };

    const statusHtml = statusPillHtml_(j, gruppe);
    button.innerHTML = ''
      + '<div class="day-brand-topline">'
      + '<div class="brand-time">' + escapeHtml_(zeitspanne_(j)) + '</div>'
      + '<div class="day-brand-owner">' + escapeHtml_(j.owner || '-') + '</div>'
      + '<span>' + statusHtml + '</span>'
      + '</div>'
      + '<div class="day-brand-meta">Reg.-Nr. ' + escapeHtml_(j.regNr || '-') + ' · ' + gruppe.jobs.length + ' Fass' + (gruppe.jobs.length === 1 ? '' : 'er') + '</div>'
      + '<div class="day-brand-meta">Brenner: ' + escapeHtml_(j.brenner || '-') + '</div>';

    return button;
  }

  function zeichneAktiveGruppe_(gruppe, index) {
    aktiveLeitstandGruppe = gruppe || null;
    const cont = document.getElementById('jobList');
    if (!cont) return;
    cont.innerHTML = '';
    const card = document.createElement('div');
    card.className = gruppe && gruppe.archivInfo ? 'brand-main-card archiv-info-card' : 'brand-main-card';
    card.innerHTML = baueBrandHauptkarteHtml_(gruppe, index);
    cont.appendChild(card);
    berechneWasserzugabe_();
    berechneKosten_();
    zeichneProtokollVorschau(aktuelleLeitstandGruppen);
  }

  function baueBrandHauptkarteHtml_(gruppe, index) {
    const j = gruppe.first || {};
    const istArchiv = !!(gruppe && gruppe.archivInfo);
    const disabledAttr = j.link ? '' : ' disabled';
    const dossierClick = j.link ? ' onclick="openLinkSafe(\'' + escapeJs_(j.link || '') + '\')"' : '';

    return ''
      + '<div class="brand-headline">'
      + '<div class="brand-time">' + escapeHtml_(zeitspanne_(j)) + '</div>'
      + '<div class="brand-owner-name">' + escapeHtml_(j.owner || '-') + '</div>'
      + '<button class="drive-open-btn" type="button"' + disabledAttr + dossierClick + '>📁 Drive-Ordner öffnen</button>'
      + '</div>'
      + '<div class="meta-grid">'
      + '<div class="meta-cell"><div class="meta-label">Zollstatus</div><div class="meta-value">' + statusPillHtml_(j, gruppe) + '</div></div>'
      + '<div class="meta-cell"><div class="meta-label">Registernummer</div><div class="meta-value">' + escapeHtml_(j.regNr || '-') + '</div></div>'
      + '<div class="meta-cell"><div class="meta-label">Brenner</div><div class="meta-value">' + escapeHtml_(j.brenner || '-') + '</div></div>'
      + '</div>'
      + '<div class="fass-section-title">' + escapeHtml_(zeitspanne_(j) + ' · ' + (j.owner || '-')) + '</div>'
      + '<div class="fass-cards">' + (gruppe.jobs || []).map(function(job, fassIndex) { return baueFassKarteHtml_(job, fassIndex, istArchiv); }).join('') + '</div>'
      + '<div class="result-grid">'
      + '<div class="meta-cell"><div class="meta-label">Von</div><div class="meta-value">' + escapeHtml_(j.von || '-') + '</div></div>'
      + '<div class="meta-cell"><div class="meta-label">Bis</div><div class="meta-value">' + escapeHtml_(j.bis || '-') + '</div></div>'
      + '<div class="meta-cell required-input"><div class="meta-label">Alkohol %</div><div class="meta-value">' + (istArchiv ? escapeHtml_(j.alk || '-') : '<input type="number" step="0.01" value="' + escapeAttr_(j.alk || '') + '" data-role="gruppenAlkohol" oninput="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'alkohol\', this.value)" onchange="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'alkohol\', this.value)">') + '</div></div>'
      + '<div class="meta-cell required-input"><div class="meta-label">Liter Destillat</div><div class="meta-value">' + (istArchiv ? escapeHtml_(j.ausbeute || j.liter || j.literDestillat || '-') : '<input type="number" step="0.01" value="' + escapeAttr_(j.ausbeute || j.liter || j.literDestillat || '') + '" data-role="gruppenAusbeute" oninput="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'ausbeute\', this.value)" onchange="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'ausbeute\', this.value)">') + '</div></div>'
      + '</div>'
      + '<div class="fass-section-title">Branddetails / Herabsetzung / Kosten</div>'
      + '<div class="result-grid">'
      + '<div class="meta-cell required-input"><div class="meta-label">Trinkstärke %</div><div class="meta-value">' + (istArchiv ? escapeHtml_(j.trinkstaerke || '-') : '<input type="number" step="0.1" value="' + escapeAttr_(j.trinkstaerke || '') + '" data-role="gruppenTrinkstaerke" oninput="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'trinkstaerke\', this.value)" onchange="berechneWasserzugabe_(); uebernehmeGruppenFeld_(\'trinkstaerke\', this.value)">') + '</div></div>'
      + '<div class="meta-cell calculated-output"><div class="meta-label">Wasserzugabe</div><div class="meta-value" data-role="wasserzugabeAnzeige">' + (istArchiv ? escapeHtml_(j.wasser || '-') : '-') + '</div></div>'
      + '<div class="meta-cell calculated-output"><div class="meta-label">Endmenge</div><div class="meta-value" data-role="endmengeAnzeige">' + (istArchiv ? escapeHtml_(j.endmenge || '-') : '-') + '</div></div>'
      + (istArchiv ? '' : '<input type="hidden" value="' + escapeAttr_(j.liter || j.literDestillat || j.ausbeute || '') + '" data-role="gruppenLiter">')
      + '<div class="meta-cell required-input"><div class="meta-label">Kostensatz</div><div class="meta-value">' + (istArchiv ? escapeHtml_(j.kostenart || '-') : selectKostenartHtml_(j)) + '</div></div>'
      + '<div class="meta-cell calculated-output"><div class="meta-label">Kosten Brand</div><div class="meta-value" data-role="kostenAnzeige">' + (istArchiv ? escapeHtml_(j.kosten || '-') : '-') + '</div></div>'
      + '</div>'
      + (istArchiv ? '' : '<div class="brand-action-row"><button class="brand-save-btn" type="button" onclick="markiereAktiveBrandKartenZumSpeichern_(false); saveAllCards(this)">💾 SPEICHERN</button><button class="brand-burn-btn" type="button" onclick="markiereAktiveBrandKartenZumSpeichern_(true); saveAllCards(this)">🔥 ALS GEBRANNT MARKIEREN</button></div>');
  }


  function statusPillHtml_(j, gruppe) {
    const text = String((j && (j.zollOk || j.zollStatus || j.status)) || '').trim();
    const archiv = !!(gruppe && gruppe.archivInfo);
    const abgelehnt = /abgelehnt/i.test(text) || !!(j && j.zollAbgelehnt);
    const genehmigt = istZollGenehmigt(text) || !!(j && j.regNr);
    let klasse = 'status-pill';
    if (archiv) klasse += ' done';
    else if (abgelehnt) klasse += ' rejected';
    else if (genehmigt) klasse += ' approved';
    else klasse += ' open';
    return '<span class="' + klasse + '">' + escapeHtml_(text || (genehmigt ? 'ZOLL GENEHMIGT' : 'OFFEN')) + '</span>';
  }

  function ermittleZollListenText_(j) {
    const info = String((j && (j.zollListe || j.zollliste || j.infoSystem || j.bemerkung || j.fassSplittung)) || '').trim();
    const match = info.match(/\bZL[-_ ]?\d{2,4}[-_ ]?\d{1,6}\b/i);
    if (match) return match[0];
    return j && j.regNr ? 'über Reg.-Nr. zugeordnet' : '-';
  }

  function zeichneZollVorschau(gruppe) {
    const ziel = document.getElementById('zollPreviewCard');
    if (!ziel) return;
    if (!gruppe) { ziel.innerHTML = '<div class="lower-card-title">Zoll</div><div class="day-brand-meta">Kein Brand ausgewählt.</div>'; return; }
    const j = gruppe.first || {};
    ziel.innerHTML = '<div class="lower-card-title">Zoll</div>'
      + '<div class="meta-grid">'
      + '<div class="meta-cell"><div class="meta-label">Zollstatus</div><div class="meta-value">' + statusPillHtml_(j, gruppe) + '</div></div>'
      + '<div class="meta-cell"><div class="meta-label">Registernummer</div><div class="meta-value">' + escapeHtml_(j.regNr || '-') + '</div></div>'
      + '</div><button type="button" class="zoll-open-btn" onclick="openZollKontakte(event)">Zoll / Kontaktliste öffnen</button>';
  }

  function zeichneProtokollVorschau(gruppeOderGruppen) {
    const ziel = document.getElementById('protocolPreviewCard');
    if (!ziel) return;
    const gruppen = Array.isArray(gruppeOderGruppen)
      ? gruppeOderGruppen
      : (gruppeOderGruppen ? [gruppeOderGruppen] : []);

    if (!gruppen.length) {
      ziel.innerHTML = '<div class="lower-card-title">Brennprotokoll Vorschau</div><div class="day-brand-meta">Kein Brenntag geladen.</div>';
      return;
    }

    const erster = (gruppen[0] && gruppen[0].first) || {};
    const brandtag = erster.tagBrand || document.getElementById('tagPicker').value || '-';
    const zeilen = gruppen.map(function(gruppe) {
      const j = gruppe.first || {};
      const fassText = (gruppe.jobs || []).map(function(job) {
        const anteile = fallbackFassanteileAusJob_(job);
        if (anteile && anteile.length) {
          return anteile.map(function(a) {
            return 'Fass ' + (a.fassnummer || '-')
              + (a.material ? ' – ' + a.material : '')
              + (a.entnahme ? ' · Entnahme ' + formatLiter_(a.entnahme) : '')
              + (a.rest ? ' · Rest ' + formatLiter_(a.rest) : '');
          }).join('<br>');
        }
        return job.fassNr || job.fassnummer || '-';
      }).join('<br>');

      return '<tr>'
        + '<td>' + escapeHtml_(zeitspanne_(j)) + '</td>'
        + '<td>' + escapeHtml_(j.owner || '-') + '</td>'
        + '<td>' + escapeHtml_(j.regNr || '-') + '</td>'
        + '<td>' + fassText + '</td>'
        + '</tr>';
    }).join('');

    ziel.innerHTML = '<div class="lower-card-title">Brennprotokoll Vorschau · ganzer Tag</div>'
      + '<div class="protocol-paper mini-preview">'
      + '<div class="protocol-paper-title">Brennprotokoll</div>'
      + '<div class="protocol-line"><strong>Brandtag</strong><span>' + escapeHtml_(brandtag) + '</span></div>'
      + '<table class="protocol-table"><thead><tr><th>Uhrzeit</th><th>Stoffbesitzer</th><th>Registernummer</th><th>Fässer / Material / Entnahme</th></tr></thead><tbody>' + zeilen + '</tbody></table>'
      + '</div>'
      + '<div class="protocol-button-row"><button type="button" class="protocol-action-btn primary" onclick="druckePaket()">Brennprotokoll öffnen</button></div>';
  }

  function zeitspanne_(j) {
    const von = String(j && j.von || '').trim();
    const bis = String(j && j.bis || '').trim();
    if (von && bis) return von + '–' + bis;
    if (von) return von + '–?';
    if (bis) return '?–' + bis;
    return '-';
  }

  function zahlAusEingabe_(wert) {
    const text = String(wert || '').replace(',', '.').replace(/[^0-9.\-]/g, '');
    const zahl = Number(text);
    return isFinite(zahl) ? zahl : 0;
  }

  function zahlFormatDeutsch_(zahl) {
    if (!isFinite(Number(zahl))) return '';
    return Number(zahl).toFixed(2).replace('.', ',');
  }

  function berechneWasserzugabe_() {
    const literInput = document.querySelector('[data-role="gruppenLiter"]');
    const wasserZiel = document.querySelector('[data-role="wasserzugabeAnzeige"]');
    const endmengeZiel = document.querySelector('[data-role="endmengeAnzeige"]');

    const alkoholFeld = document.querySelector('[data-role="gruppenAlkohol"]');
    const ausbeuteFeld = document.querySelector('[data-role="gruppenAusbeute"]');
    const trinkFeld = document.querySelector('[data-role="gruppenTrinkstaerke"]');

    const alkohol = zahlAusEingabe_(alkoholFeld && alkoholFeld.value);
    const ausbeute = zahlAusEingabe_(ausbeuteFeld && ausbeuteFeld.value);
    const trink = zahlAusEingabe_(trinkFeld && trinkFeld.value);
    let liter = zahlAusEingabe_(literInput && literInput.value);

    if (ausbeute > 0) {
      liter = ausbeute;
      if (literInput) {
        literInput.value = zahlFormatDeutsch_(liter);
        uebernehmeGruppenFeld_('liter', literInput.value);
      }
    }

    if (!liter || !alkohol || !trink) {
      if (wasserZiel) wasserZiel.textContent = '-';
      if (endmengeZiel) endmengeZiel.textContent = '-';
      uebernehmeGruppenFeld_('wasser', '');
      uebernehmeGruppenFeld_('endmenge', '');
      return;
    }

    const endmenge = (liter * alkohol) / trink;
    const wasser = endmenge - liter;
    const wasserText = wasser >= 0 ? zahlFormatDeutsch_(wasser) : '';
    const endmengeText = zahlFormatDeutsch_(endmenge);

    if (wasserZiel) wasserZiel.textContent = wasserText ? wasserText + ' Liter' : '-';
    if (endmengeZiel) endmengeZiel.textContent = endmengeText ? endmengeText + ' Liter' : '-';
    uebernehmeGruppenFeld_('wasser', wasserText);
    uebernehmeGruppenFeld_('endmenge', endmengeText);
  }

  function normalisiereKostenart_(wert) {
    const text = String(wert || '').trim().toLowerCase();
    if (/nicht/.test(text) || /40/.test(text)) return 'nichtmitglied';
    if (/mitglied/.test(text) || /32/.test(text)) return 'mitglied';
    return 'mitglied';
  }

  function selectKostenartHtml_(j) {
    const wert = normalisiereKostenart_((j && (j.kostenart || j.kostensatz || j.kosten)) || '');
    return '<select data-role="kostenart" onchange="berechneKosten_(); uebernehmeGruppenFeld_(\'kostenart\', this.value)">'
      + '<option value="mitglied"' + (wert === 'mitglied' ? ' selected' : '') + '>Mitglied – 32 €</option>'
      + '<option value="nichtmitglied"' + (wert === 'nichtmitglied' ? ' selected' : '') + '>Nichtmitglied – 40 €</option>'
      + '</select>';
  }

  function berechneKosten_() {
    const select = document.querySelector('[data-role="kostenart"]');
    const ziel = document.querySelector('[data-role="kostenAnzeige"]');
    if (!select || !ziel) return;
    const kosten = select.value === 'nichtmitglied' ? '40 €' : '32 €';
    ziel.textContent = kosten;
    uebernehmeGruppenFeld_('kosten', kosten);
  }

  function uebernehmeGruppenFeld_(feld, wert) {
    const rollen = {
      alkohol: 'alkohol',
      ausbeute: 'ausbeute',
      liter: 'liter',
      trinkstaerke: 'trinkstaerke',
      wasser: 'wasser',
      endmenge: 'endmenge',
      kostenart: 'kostenart',
      kosten: 'kosten'
    };
    const role = rollen[feld] || feld;
    document.querySelectorAll('#jobList .job-card').forEach(function(card) {
      const input = card.querySelector('[data-role="' + role + '"]');
      if (input) input.value = wert;
    });
  }

  function extrahiereFassanteileAusText_(text) {
        const roh = String(text || '').trim();
        if (!roh) return [];
        const lines = roh.split(/\r?\n/);
        const anteile = [];

        lines.forEach(function(line) {
          const zeile = String(line || '').trim();
          if (!zeile || !/^[-•]?\s*Fass\s+/i.test(zeile)) return;

          let match = zeile.match(/^[-•]?\s*Fass\s+(.+?)\s*\|\s*Fassvolumen:\s*(.*?)\s*\|\s*Fassinhalt:\s*(.*?)\s*\|\s*Material:\s*(.*?)\s*\|\s*Gewürze:\s*(.*?)\s*\|\s*Entnahme:\s*(.*?)\s*\|\s*Rest:\s*(.*?)\s*\|\s*Zuordnung:\s*(.*)$/i);
          if (match) {
            anteile.push({
              fassnummer: String(match[1] || '').trim(),
              fassvolumen: String(match[2] || '').trim(),
              fassinhalt: String(match[3] || '').trim(),
              material: String(match[4] || '').trim(),
              gewuerze: String(match[5] || '').trim(),
              entnahme: String(match[6] || '').trim(),
              rest: String(match[7] || '').trim(),
              zuordnung: String(match[8] || '').trim()
            });
            return;
          }

          match = zeile.match(/^[-•]?\s*Fass\s+(.+?)\s*\|\s*Gesamt:\s*(.*?)\s*\|\s*Entnahme:\s*(.*?)\s*\|\s*Rest:\s*(.*?)\s*\|\s*Zuordnung:\s*(.*)$/i);
          if (match) {
            anteile.push({
              fassnummer: String(match[1] || '').trim(),
              fassvolumen: '',
              fassinhalt: String(match[2] || '').trim(),
              material: '',
              gewuerze: '',
              entnahme: String(match[3] || '').trim(),
              rest: String(match[4] || '').trim(),
              zuordnung: String(match[5] || '').trim()
            });
            return;
          }

          const teile = zeile.replace(/^[-•]\s*/, '').split(/\s*\|\s*/).map(function(v) {
            return String(v || '').trim();
          }).filter(Boolean);

          const kopf = teile.shift() || '';
          const kopfMatch = kopf.match(/^Fass\s+(.+)$/i);
          if (!kopfMatch || !teile.length) return;

          const obj = {
            fassnummer: String(kopfMatch[1] || '').trim(),
            fassvolumen: '',
            fassinhalt: '',
            material: '',
            gewuerze: '',
            entnahme: '',
            rest: '',
            zuordnung: ''
          };

          teile.forEach(function(teil) {
            const feld = String(teil || '').split(/\s*:\s*/);
            const label = String(feld.shift() || '').trim().toLowerCase();
            const wert = feld.join(':').trim();
            if (!label) return;

            if (label.indexOf('fassvolumen') >= 0 || label === 'volumen') obj.fassvolumen = wert;
            else if (label.indexOf('fassinhalt') >= 0 || label === 'inhalt' || label === 'gesamt') obj.fassinhalt = wert;
            else if (label.indexOf('material') >= 0 || label.indexOf('rohstoff') >= 0) obj.material = wert;
            else if (label.indexOf('gewürz') >= 0 || label.indexOf('gewuerz') >= 0) obj.gewuerze = wert;
            else if (label.indexOf('entnahme') >= 0) obj.entnahme = wert;
            else if (label === 'rest') obj.rest = wert;
            else if (label.indexOf('zuordnung') >= 0 || label.indexOf('rest /') >= 0) obj.zuordnung = wert;
          });

          anteile.push(obj);
        });
        return anteile;
  }

  function entferneFassanteileBlockAusText_(text) {
        const roh = String(text || '');
        if (!roh.trim()) return '';
        return roh
          .split(/\r?\n/)
          .filter(function(line) {
            const zeile = String(line || '').trim();
            if (!zeile) return true;
            if (/^FASSANTEILE_DIESES_BRANDS\s*:/i.test(zeile)) return false;
            if (/^[-•]?\s*Fass\s+.+?\s*\|\s*Fassvolumen:\s*.*?\s*\|\s*Fassinhalt:/i.test(zeile)) return false;
            if (/^[-•]?\s*Fass\s+.+?\s*\|\s*Gesamt:\s*.*?\s*\|\s*Entnahme:/i.test(zeile)) return false;
            if (/^Entnahme\s+für\s+diesen\s+Brand\s*:/i.test(zeile)) return false;
            return true;
          })
          .join('\n')
          .trim();
  }

  function normalisiereFassKey_(wert) {
    return String(wert || '')
      .trim()
      .replace(/^fass\s*/i, '')
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  function fassListeAusText_(text) {
    const roh = String(text || '').trim();
    if (!roh) return [];

    return roh
      .replace(/\bFass\b/gi, '')
      .split(/\s*\/\s*|\s*,\s*|\s*;\s*|\s*\|\s*/)
      .map(function(v) { return String(v || '').trim(); })
      .filter(Boolean);
  }

  function wertJeFassAusSammelfeld_(text, fassnummer, index) {
    const roh = String(text || '').trim();
    if (!roh) return '';

    const gesucht = normalisiereFassKey_(fassnummer);
    const teile = roh.split(/\s*\|\s*|\s*;\s*|\r?\n/).map(function(v) {
      return String(v || '').trim();
    }).filter(Boolean);

    for (let i = 0; i < teile.length; i++) {
      const teil = teile[i];
      let match = teil.match(/^(?:Fass\s*)?([^:=]+?)\s*[:=]\s*(.+)$/i);
      if (match && normalisiereFassKey_(match[1]) === gesucht) {
        return String(match[2] || '').trim();
      }

      match = teil.match(/^(?:Fass\s*)?([A-Za-z0-9_-]+)\s+(.+)$/i);
      if (match && normalisiereFassKey_(match[1]) === gesucht) {
        return String(match[2] || '').trim();
      }
    }

    const positionswerte = roh
      .split(/\s*\/\s*|\s*\|\s*|\s*;\s*/)
      .map(function(v) { return String(v || '').trim(); })
      .filter(Boolean)
      .filter(function(v) { return !/^[A-Za-z]$/.test(v); });

    if (positionswerte.length > 1 && index >= 0 && index < positionswerte.length) {
      const wert = positionswerte[index];
      const keyed = wert.match(/^(?:Fass\s*)?[^:=]+?\s*[:=]\s*(.+)$/i);
      return keyed ? String(keyed[1] || '').trim() : wert;
    }

    return roh;
  }

  function erstesNichtLeer_(werte) {
    for (let i = 0; i < werte.length; i++) {
      const wert = String(werte[i] || '').trim();
      if (wert) return wert;
    }
    return '';
  }

  function fallbackFassanteileAusJob_(j) {
    const anteile = extrahiereFassanteileAusText_(j && j.fassSplittung);
    if (anteile.length) return anteile;

    const fassNrText = String(j && j.fassNr || '').trim();
    const fassListe = fassListeAusText_(fassNrText);

    if (!fassListe.length) {
      return [{
        fassnummer: '-',
        fassvolumen: j && j.fassgroesse || '',
        fassinhalt: j && j.inhalt || '',
        material: j && j.material || '',
        gewuerze: j && j.gewuerze || '',
        entnahme: '',
        rest: '',
        zuordnung: ''
      }];
    }

    return fassListe.map(function(fass, index) {
      const fassvolumen = wertJeFassAusSammelfeld_(j && j.fassgroesse, fass, index);
      const fassinhalt = wertJeFassAusSammelfeld_(j && j.inhalt, fass, index);
      const material = wertJeFassAusSammelfeld_(j && j.material, fass, index);
      const gewuerze = wertJeFassAusSammelfeld_(j && j.gewuerze, fass, index);
      const entnahme = erstesNichtLeer_([
        wertJeFassAusSammelfeld_(j && j.entnahmeBrand, fass, index),
        wertJeFassAusSammelfeld_(j && j.entnahme, fass, index),
        wertJeFassAusSammelfeld_(j && j.entnahmeFuerDiesenBrand, fass, index)
      ]);

      return {
        fassnummer: fass,
        fassvolumen: fassvolumen,
        fassinhalt: fassinhalt,
        material: material,
        gewuerze: gewuerze,
        entnahme: entnahme,
        rest: '',
        zuordnung: ''
      };
    });
  }

  function fassanteilDoppeltErfasst_(job, anteil) {
    const row = String(Number(job && job.row) || 0);
    const fass = String(anteil && anteil.fassnummer || '').trim().toLowerCase();
    const entnahme = String(anteil && anteil.entnahme || '').trim().toLowerCase();
    const alleJobs = Array.isArray(aktuelleLeitstandJobs) ? aktuelleLeitstandJobs : [];
    if (!fass || !entnahme || !alleJobs.length) return false;
    return alleJobs.some(function(other) {
      if (String(Number(other && other.row) || 0) === row) return false;
      if (!other || (!other.alk && !other.ausbeute && !other.erledigt && !other.istMinderausbeute)) return false;
      return fallbackFassanteileAusJob_(other).some(function(a) {
        return String(a.fassnummer || '').trim().toLowerCase() === fass && String(a.entnahme || '').trim().toLowerCase() === entnahme;
      });
    });
  }

  function fassIstInAnderemBrandGesperrt_(job) {
    return false;
  }

  function baueFassKarteHtml_(j, index, istArchiv) {
    const row = String(Number(j.row) || 0);
    const vId = escapeAttr_(j.vId || '');
    const anteile = fallbackFassanteileAusJob_(j);
    const bemerkung = entferneFassanteileBlockAusText_(j.fassSplittung || '');
    const minderausbeuteChecked = j.istMinderausbeute ? 'checked' : '';
    const readonlyInfo = istArchiv ? ' data-readonly="true"' : '';

    const fassHtml = anteile.map(function(anteil, anteilIndex) {
      const doppelt = !istArchiv && fassanteilDoppeltErfasst_(j, anteil);
      const chip = doppelt ? '<div class="fass-type-chip split">BEREITS ERFASST</div>' : (anteil.rest && anteil.rest !== '-' ? '<div class="fass-type-chip split">GESPLITTET</div>' : '<div class="fass-type-chip">FASSANTEIL</div>');
      return ''
        + '<div class="fass-anteil-box' + (doppelt ? ' locked-other-brand' : '') + '">'
        + '<div class="fass-title-row"><div class="fass-title">Fass ' + escapeHtml_(anteil.fassnummer || '-') + (anteil.material ? ' – ' + escapeHtml_(anteil.material) : '') + '</div>' + chip + '</div>'
        + '<div class="fass-values">'
        + '<div class="meta-cell"><div class="meta-label">Fassnummer</div><div class="meta-value">' + escapeHtml_(anteil.fassnummer || '-') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Fassvolumen</div><div class="meta-value">' + escapeHtml_(formatLiter_(anteil.fassvolumen || '-')) + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Fassinhalt</div><div class="meta-value">' + escapeHtml_(formatLiter_(anteil.fassinhalt || '-')) + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Material</div><div class="meta-value">' + escapeHtml_(anteil.material || '-') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Gewürze</div><div class="meta-value">' + escapeHtml_(anteil.gewuerze || '-') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Entnahme für diesen Brand</div><div class="meta-value">' + escapeHtml_(formatLiter_(anteil.entnahme || '-')) + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Rest</div><div class="meta-value">' + escapeHtml_(formatLiter_(anteil.rest || '-')) + '</div></div>'
        + '<div class="meta-cell"><div class="meta-label">Rest / Zuordnung</div><div class="meta-value">' + escapeHtml_(anteil.zuordnung || '-') + '</div></div>'
        + (doppelt ? '<div class="fass-lock-note">Dieser Fassanteil ist bereits in einem anderen Brand mit Brenndaten erfasst.</div>' : '')
        + '</div>'
        + '</div>';
    }).join('');

    return ''
      + '<div class="fass-card job-card" data-row="' + row + '" data-vid="' + vId + '"' + readonlyInfo + '>'
      + '<div class="fass-icon">▥</div>'
      + '<div class="fass-body">'
      + '<div class="fass-title-row"><div class="fass-title">' + escapeHtml_(zeitspanne_(j) + ' · ' + (j.owner || '-')) + '</div><div class="fass-type-chip">BRAND</div></div>'
      + '<div class="fass-anteil-list">' + fassHtml + '</div>'
      + (bemerkung ? '<div class="fass-split-note">' + escapeHtml_(bemerkung) + '</div>' : '')
      + (istArchiv ? '<div class="archive-chip">ARCHIV</div>' : '<div class="fass-action-row"><label class="mini-check fass-check"><input type="checkbox" data-role="zumSpeichern"><span>Übernehmen</span></label><label class="mini-check fass-check"><input type="checkbox" ' + minderausbeuteChecked + ' data-role="minderausbeute" onchange="handleMinderausbeuteChange(this)"><span>Minderausbeute</span></label></div>')
      + '</div>'
      + '<div class="fass-card-actions">'
      + '<input type="hidden" data-role="alkohol" value="' + escapeAttr_(j.alk || '') + '">'
      + '<input type="hidden" data-role="ausbeute" value="' + escapeAttr_(j.ausbeute || '') + '">'
      + '<input type="hidden" data-role="liter" value="' + escapeAttr_(j.liter || j.literDestillat || '') + '">'
      + '<input type="hidden" data-role="trinkstaerke" value="' + escapeAttr_(j.trinkstaerke || '') + '">'
      + '<input type="hidden" data-role="wasser" value="' + escapeAttr_(j.wasser || '') + '">'
      + '<input type="hidden" data-role="endmenge" value="' + escapeAttr_(j.endmenge || '') + '">'
      + '<input type="hidden" data-role="kostenart" value="' + escapeAttr_(normalisiereKostenart_((j.kostenart || j.kostensatz || j.kosten) || '')) + '">'
      + '<input type="hidden" data-role="kosten" value="' + escapeAttr_(j.kosten || '') + '">'
      + '</div>'
      + '<input type="hidden" data-role="zollAbgelehnt" value="false">'
      + '<input type="hidden" data-role="ablehnungBemerkung" value="">'
      + '</div>';
  }

  function markiereAktiveBrandKartenZumSpeichern_(auchErledigt) {
    const gruppenAlkohol = document.querySelector('[data-role="gruppenAlkohol"]');
    const gruppenAusbeute = document.querySelector('[data-role="gruppenAusbeute"]');
    const gruppenLiter = document.querySelector('[data-role="gruppenLiter"]');
    const gruppenTrinkstaerke = document.querySelector('[data-role="gruppenTrinkstaerke"]');
    const wasserHiddenWert = document.querySelector('[data-role="wasser"]');
    const endmengeHiddenWert = document.querySelector('[data-role="endmenge"]');
    const kostenart = document.querySelector('[data-role="kostenart"]');
    const kostenAnzeige = document.querySelector('[data-role="kostenAnzeige"]');

    document.querySelectorAll('#jobList .job-card').forEach(function(card) {
      if (card.dataset && card.dataset.readonly === 'true') return;
      const speichern = card.querySelector('[data-role="zumSpeichern"]');
      const alkohol = card.querySelector('[data-role="alkohol"]');
      const ausbeute = card.querySelector('[data-role="ausbeute"]');
      const liter = card.querySelector('[data-role="liter"]');
      const trinkstaerke = card.querySelector('[data-role="trinkstaerke"]');
      const wasserHidden = card.querySelector('[data-role="wasser"]');
      const endmengeHidden = card.querySelector('[data-role="endmenge"]');
      const kostenartHidden = card.querySelector('[data-role="kostenart"]');
      const kostenHidden = card.querySelector('[data-role="kosten"]');

      if (speichern) speichern.checked = true;
      if (alkohol && gruppenAlkohol) alkohol.value = gruppenAlkohol.value;
      if (ausbeute && gruppenAusbeute) ausbeute.value = gruppenAusbeute.value;
      if (liter && gruppenLiter) liter.value = gruppenLiter.value;
      if (trinkstaerke && gruppenTrinkstaerke) trinkstaerke.value = gruppenTrinkstaerke.value;
      if (wasserHidden && wasserHiddenWert) wasserHidden.value = wasserHiddenWert.value;
      if (endmengeHidden && endmengeHiddenWert) endmengeHidden.value = endmengeHiddenWert.value;
      if (kostenartHidden && kostenart) kostenartHidden.value = kostenart.value;
      if (kostenHidden && kostenAnzeige) kostenHidden.value = kostenAnzeige.textContent || '';
    });
  }

  function toggleDetails(detailId, button) {
    const panel = document.getElementById(detailId);
    if (!panel) {
      showStatus('Details konnten nicht geöffnet werden: Detailbereich nicht gefunden.', 'error');
      return;
    }

    const wirdGeoeffnet = !panel.classList.contains('open');
    panel.classList.toggle('open', wirdGeoeffnet);

    if (button) {
      button.setAttribute('aria-expanded', wirdGeoeffnet ? 'true' : 'false');
      const arrow = button.querySelector('.details-toggle-arrow');
      if (arrow) {
        arrow.textContent = wirdGeoeffnet ? '−' : '＋';
      }
    }
  }

  function toggleAblehnungBemerkung(checkbox) {
    const card = checkbox ? checkbox.closest('.job-card') : null;
    const block = card ? card.querySelector('[data-role="ablehnungBemerkungBlock"]') : null;
    const panel = card ? card.querySelector('.details-panel') : null;
    if (block) block.style.display = checkbox.checked ? 'block' : 'none';
    if (panel && checkbox.checked) panel.classList.add('open');
  }

  function handleMinderausbeuteChange(checkbox) {
    const card = checkbox ? checkbox.closest('.job-card') : null;
    if (!card) return;

    const ausbeuteFeld = card.querySelector('[data-role="ausbeute"]');
    const alkoholFeld = card.querySelector('[data-role="alkohol"]');
    const speichernFeld = card.querySelector('[data-role="zumSpeichern"]');

    if (checkbox.checked) {
      if (ausbeuteFeld) ausbeuteFeld.value = '0';
      if (alkoholFeld) alkoholFeld.value = '0';
      if (speichernFeld) speichernFeld.checked = true;
    }
  }

  function lesePayloadAusKarte(card) {
    return {
      row: Number(card && card.dataset ? card.dataset.row : 0) || 0,
      vId: card && card.dataset ? String(card.dataset.vid || '') : '',
      alkohol: leseFeldwert(card, 'alkohol'),
      ausbeute: leseFeldwert(card, 'ausbeute'),
      liter: leseFeldwert(card, 'liter'),
      trinkstaerke: leseFeldwert(card, 'trinkstaerke'),
      wasser: leseFeldwert(card, 'wasser'),
      endmenge: leseFeldwert(card, 'endmenge'),
      kostenart: leseFeldwert(card, 'kostenart'),
      kosten: leseFeldwert(card, 'kosten'),
      erledigt: true,
      minderausbeute: leseCheckbox(card, 'minderausbeute'),
      zollAbgelehnt: false,
      ablehnungBemerkung: ''
    };
  }

  function saveAllCards(button) {
    showToast('Speicherung wird geprüft ...', 'success', 0);
    const cards = Array.prototype.slice.call(document.querySelectorAll('.job-card'));

    if (!cards.length) {
      showStatus('Keine Vorgänge zum Speichern vorhanden.', 'error');
      return;
    }

    const markierteCards = cards.filter(function(card) {
      if (card.dataset && card.dataset.readonly === 'true') return false;
      return leseCheckbox(card, 'zumSpeichern');
    });

    if (!markierteCards.length) {
      showStatus('Keine Zeile markiert. Bitte bei den fertigen Zeilen „Übernehmen“ anhaken.', 'error');
      return;
    }

    const payloads = markierteCards.map(lesePayloadAusKarte).filter(function(payload) {
      const hatEingabe = String(payload.alkohol || '').trim()
        || String(payload.ausbeute || '').trim()
        || String(payload.liter || '').trim()
        || String(payload.trinkstaerke || '').trim()
        || String(payload.wasser || '').trim()
        || String(payload.endmenge || '').trim()
        || String(payload.kostenart || '').trim()
        || String(payload.kosten || '').trim()
        || payload.minderausbeute === true;
      return (payload.row || payload.vId) && hatEingabe;
    });

    if (!payloads.length) {
      showStatus('Markierte Zeilen haben keine Eingaben. Nicht markierte Vorgänge bleiben offen.', 'error');
      return;
    }

    setBusy(true, button, 'Speichere ...');
    showToast('Markierte Zeilen werden gespeichert ...', 'success', 0);

    google.script.run
      .withSuccessHandler(function(res) {
        setBusy(false, button);
        const gespeichert = res && typeof res.gespeichert !== 'undefined' ? Number(res.gespeichert) || 0 : 0;
        const teilgespeichert = res && typeof res.teilgespeichert !== 'undefined' ? Number(res.teilgespeichert) || 0 : 0;
        const abgelehnt = res && typeof res.abgelehnt !== 'undefined' ? Number(res.abgelehnt) || 0 : 0;
        const uebersprungen = res && typeof res.uebersprungen !== 'undefined' ? Number(res.uebersprungen) || 0 : 0;
        const archiviert = res && typeof res.archiviert !== 'undefined' ? Number(res.archiviert) || 0 : 0;

        showStatus(
          'Markierte Zeilen gespeichert. Vollständig: ' + gespeichert +
          ' | Teilgespeichert: ' + teilgespeichert +
          ' | Abgelehnt: ' + abgelehnt +
          ' | Übersprungen: ' + uebersprungen +
          ' | Archiviert: ' + archiviert + '.',
          'success'
        );
        showToast('Speicherung erfolgreich', 'success', 3200);
        aktualisiereKalenderdatenNachSpeichern();
      })
      .withFailureHandler(function(err) {
        setBusy(false, button);
        const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
        showStatus('Speichern nicht möglich: ' + msg, 'error');
        showToast('Speichern nicht möglich', 'error', 4200);
        fetchJobs();
      })
      .saveLeitstandEintraegeBatch(payloads);
  }


  function druckePaket() {
    const datum = document.getElementById('tagPicker').value;
    if (!datum) {
      showStatus('Bitte zuerst einen Brandtag im Kalender auswählen.', 'error');
      return;
    }

    // Wichtig bei GitHub/iframe: Fenster sofort im echten Button-Klick öffnen.
    // Öffnen erst im google.script.run-Success wird von Browsern oft als Popup blockiert.
    let printWin = null;
    try {
      printWin = window.open('', 'brennprotokoll_print');
      if (printWin) {
        printWin.document.open();
        printWin.document.write('<html><head><title>Brennprotokoll</title></head><body style="font-family:Segoe UI,Arial,sans-serif;padding:24px;">Brennprotokoll wird geladen ...</body></html>');
        printWin.document.close();
      }
    } catch (e) {
      printWin = null;
    }

    showToast('Brennprotokoll wird geladen ...', 'info', 1800);
    google.script.run
      .withSuccessHandler(function(html) {
        html = html || '<html><body>Kein Brennprotokoll erzeugt.</body></html>';

        if (printWin && !printWin.closed) {
          try {
            printWin.document.open();
            printWin.document.write(html);
            printWin.document.close();
            printWin.focus();
            setTimeout(function() {
              try {
                printWin.print();
                showToast('Brennprotokoll geöffnet.', 'success', 1800);
              } catch (e) {
                showToast('Brennprotokoll geöffnet. Bitte im Fenster manuell drucken.', 'success', 2400);
              }
            }, 450);
            return;
          } catch (e) {
            // Fallback unten
          }
        }

        const frame = document.getElementById('printFrame');
        if (!frame || !frame.contentWindow) {
          showStatus('Popup wurde blockiert. Bitte Popups für diese Seite erlauben und erneut klicken.', 'error');
          return;
        }

        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        if (!frameDoc) {
          showStatus('Druckfenster konnte nicht geöffnet werden.', 'error');
          return;
        }

        frameDoc.open();
        frameDoc.write(html);
        frameDoc.close();

        setTimeout(function() {
          try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
            showToast('Brennprotokoll geöffnet.', 'success', 1800);
          } catch (e) {
            showToast('Brennprotokoll geladen, Druckdialog konnte nicht automatisch geöffnet werden.', 'error', 4200);
          }
        }, 450);
      })
      .withFailureHandler(function(err) {
        const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
        if (printWin && !printWin.closed) {
          try {
            printWin.document.open();
            printWin.document.write('<html><body style="font-family:Segoe UI,Arial,sans-serif;padding:24px;color:#b00020;">Brennprotokoll konnte nicht geladen werden:<br><br>' + escapeHtml_(msg) + '</body></html>');
            printWin.document.close();
          } catch (e) {}
        }
        showStatus('Brennprotokoll konnte nicht geladen werden: ' + msg, 'error');
      })
      .getProtokollHtmlFuerBrandtag(datum);
  }

  function openLinkSafe(url) {
    if (!url) return;
    window.open(url, '_blank');
  }

  let zollKontaktPayload = null;
  let zollKontaktLaedt = false;

  function normalisiereZollKontakt_(k) {
    if (!k || typeof k !== 'object') return { name: '', dienstsitz: '', telefon: '', mobil: '', email: '' };
    return {
      name: k.name || k.Name || k.NAME || '',
      dienstsitz: k.dienstsitz || k.Dienstsitz || k.DIENSTSITZ || '',
      telefon: k.telefon || k.Telefon || k.TELEFON || '',
      mobil: k.mobil || k.Mobil || k.MOBIL || '',
      email: k.email || k.Email || k.EMAIL || ''
    };
  }

  function normalisiereZollPayload_(daten) {
    if (daten && typeof daten === 'object' && !Array.isArray(daten)) {
      const kontakte = Array.isArray(daten.kontakte)
        ? daten.kontakte
        : (Array.isArray(daten.Kontakte)
          ? daten.Kontakte
          : (Array.isArray(daten.KONTAKTE) ? daten.KONTAKTE : []));

      return {
        titel: daten.titel || daten.Titel || daten.TITEL || 'Zoll-Kontaktliste',
        untertitel: daten.untertitel || daten.Untertitel || daten.UNTERTITEL || 'Zentrale Kontaktliste',
        stand: daten.stand || daten.Stand || daten.STAND || '',
        faxAlleStandorte: daten.faxAlleStandorte || daten.FaxAlleStandorte || daten.FAX_ALLE_STANDORTE || daten.fax || daten.Fax || '',
        zentraleEmail: daten.zentraleEmail || daten.ZentraleEmail || daten.ZENTRALE_EMAIL || daten.email || daten.Email || '',
        kontakte: kontakte.map(normalisiereZollKontakt_)
      };
    }
    return { titel: 'Zoll-Kontaktliste', untertitel: 'Keine gültigen Daten erhalten.', stand: '', faxAlleStandorte: '', zentraleEmail: '', kontakte: [] };
  }

  function openZollKontakte(event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    if (event && typeof event.stopPropagation === 'function') event.stopPropagation();

    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}
    try { window.top.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}

    if (zollKontaktPayload && Array.isArray(zollKontaktPayload.kontakte) && zollKontaktPayload.kontakte.length) {
      showZollKontaktModal(zollKontaktPayload, true);
      showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
      return;
    }

    if (zollKontaktBootstrap) {
      const bootstrapPayload = normalisiereZollPayload_(zollKontaktBootstrap);
      if (bootstrapPayload.kontakte.length) {
        zollKontaktPayload = bootstrapPayload;
        showZollKontaktModal(bootstrapPayload, true);
        showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
        return;
      }
    }

    if (!window.google || !window.google.script || !window.google.script.run) {
      const fallbackPayload = normalisiereZollPayload_(ZOLL_KONTAKT_FALLBACK);
      zollKontaktPayload = fallbackPayload;
      showZollKontaktModal(fallbackPayload, true);
      showToast('Zoll-Kontaktliste lokal geöffnet', 'success', 2600);
      return;
    }

    if (zollKontaktLaedt) return;
    zollKontaktLaedt = true;

    showToast('Zoll-Kontaktliste wird geladen ...', 'success', 0);
    showZollKontaktModal({ titel: 'Zoll-Kontaktliste', untertitel: 'Wird geladen ...', stand: '', faxAlleStandorte: '', zentraleEmail: '', kontakte: [] }, true);

    google.script.run
      .withSuccessHandler(function(daten) {
        zollKontaktLaedt = false;
        const payload = normalisiereZollPayload_(daten);

        if (!payload.kontakte.length) {
          const fallbackPayload = normalisiereZollPayload_(ZOLL_KONTAKT_FALLBACK);
          zollKontaktPayload = fallbackPayload;
          showZollKontaktModal(fallbackPayload, true);
          showToast('Zoll-Kontaktliste lokal geöffnet', 'success', 2600);
          return;
        }

        zollKontaktPayload = payload;
        showZollKontaktModal(payload, true);
        showToast('Zoll-Kontaktliste geöffnet', 'success', 2600);
      })
      .withFailureHandler(function(err) {
        zollKontaktLaedt = false;
        const fallbackPayload = normalisiereZollPayload_(ZOLL_KONTAKT_FALLBACK);
        zollKontaktPayload = fallbackPayload;
        showZollKontaktModal(fallbackPayload, true);
        showToast('Zoll-Kontaktliste lokal geöffnet', 'success', 2600);
      })
      .getZollNotfallKontaktliste();
  }

  function showZollKontaktModal(payload, offenHalten) {
    zollKontaktPayload = payload || null;

    const modal = document.getElementById('zollModal');
    const titel = document.getElementById('zollModalTitle');
    const note = document.getElementById('zollModalNote');
    const liste = document.getElementById('zollListe');
    const zusatz = document.getElementById('zollZusatz');

    if (!modal || !titel || !note || !liste || !zusatz) {
      showStatus('Zoll-Kontaktliste konnte nicht geöffnet werden: Modal fehlt im Leitstand.', 'error');
      return;
    }

    if (!payload || !Array.isArray(payload.kontakte)) {
      modal.classList.add('active');
      setZollModalFehler_('Zoll-Kontaktliste konnte nicht geladen werden: Serverantwort ungültig.');
      showStatus('Zoll-Kontaktliste konnte nicht geladen werden: Serverantwort ungültig.', 'error');
      return;
    }

    titel.textContent = payload.titel || 'Zoll-Kontaktliste';
    note.textContent = payload.untertitel || 'Nur Anzeige der hinterlegten Zoll-Liste.';

    if (!payload.kontakte.length) {
      liste.innerHTML = '<div class="zoll-row"><div class="zoll-name">Kontaktliste wird geladen ...</div></div>';
    } else {
      liste.innerHTML = payload.kontakte.map(function(k) {
        return '<div class="zoll-row">'
          + '<div class="zoll-name">👤 ' + escapeHtml_(k.name || '') + '</div>'
          + '<div class="zoll-meta">🏢 ' + escapeHtml_(k.dienstsitz || '-') + '</div>'
          + '<div class="zoll-line">📞 Telefon: ' + linkHtml(k.telefon, 'tel') + '</div>'
          + '<div class="zoll-line">📱 Mobil: ' + linkHtml(k.mobil, 'tel') + '</div>'
          + '<div class="zoll-line">✉️ E-Mail: ' + linkHtml(k.email, 'mail') + '</div>'
          + '</div>';
      }).join('');
    }

    zusatz.innerHTML = ''
      + '<div class="zoll-summary-item"><strong>Stand:</strong> ' + escapeHtml_(payload.stand || '-') + '</div>'
      + '<div class="zoll-summary-item"><strong>Fax alle Standorte:</strong> ' + escapeHtml_(payload.faxAlleStandorte || '-') + '</div>'
      + '<div class="zoll-summary-item"><strong>Zentrale E-Mail:</strong> ' + linkHtml(payload.zentraleEmail || '-', 'mail') + '</div>';

    modal.classList.add('active');
    if (!offenHalten) showStatus('Zoll-Kontaktliste geöffnet.', 'info');
  }

  function setZollModalFehler_(text) {
    const modal = document.getElementById('zollModal');
    const note = document.getElementById('zollModalNote');
    const liste = document.getElementById('zollListe');
    const zusatz = document.getElementById('zollZusatz');
    if (modal) modal.classList.add('active');
    if (note) note.textContent = 'Fehler';
    if (liste) {
      const meldung = String(text || 'Unbekannter Fehler');
      if (meldung.indexOf('<button') >= 0) liste.innerHTML = '<div class="zoll-row"><div class="zoll-name">' + meldung + '</div></div>';
      else liste.innerHTML = '<div class="zoll-row"><div class="zoll-name">' + escapeHtml_(meldung) + '</div></div>';
    }
    if (zusatz) zusatz.innerHTML = '';
  }

  function closeZollModal() {
    document.getElementById('zollModal').classList.remove('active');
  }

  function leseFeldwert(card, role) {
    const feld = card.querySelector('[data-role="' + role + '"]');
    return feld ? feld.value : '';
  }

  function leseCheckbox(card, role) {
    const feld = card.querySelector('[data-role="' + role + '"]');
    return !!(feld && feld.checked);
  }

  function istZollGenehmigt(text) {
    return String(text || '').toUpperCase().indexOf('GENEHMIGT') !== -1 || String(text || '').toUpperCase().indexOf('ZOLL_OK') !== -1;
  }

  function linkHtml(wert, typ) {
    const text = String(wert || '').trim();
    if (!text || text === '-') return '-';

    if (typ === 'mail') {
      return '<a href="mailto:' + escapeAttr_(text) + '">' + escapeHtml_(text) + '</a>';
    }

    const tel = text.replace(/[^\d+]/g, '');
    if (!tel) return escapeHtml_(text);
    return '<a href="tel:' + escapeAttr_(tel) + '">' + escapeHtml_(text) + '</a>';
  }

  function handleModalBackdropClick(event) {
    if (event.target && event.target.id === 'zollModal') {
      closeZollModal();
    }
  }

  function formatLiter_(wert) {
    const text = String(wert || '').trim();
    if (!text || text === '-' || text === '—') return '-';
    return /liter|litre| l$/i.test(text) ? text : text + ' Liter';
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeHtml_(text) {
    return escapeHtml(text);
  }

  function escapeAttr_(text) {
    return escapeHtml(text);
  }

  function escapeJs_(text) {
    return String(text || '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '')
      .replace(/\n/g, ' ')
      .replace(/</g, '\\x3C')
      .replace(/>/g, '\\x3E');
  }

  function showServerError(err) {
    const msg = err && err.message ? err.message : String(err || 'Unbekannter Fehler');
    showStatus(msg, 'error');
  }

  function hideToast() {
    const toast = document.getElementById('saveToast');
    if (!toast) return;
    if (saveToastTimer) {
      clearTimeout(saveToastTimer);
      saveToastTimer = null;
    }
    toast.textContent = '';
    toast.className = 'save-toast';
  }

  function showStatus(message, type) {
    const box = document.getElementById('statusBox');
    const text = message || '';

    if (box) {
      box.textContent = '';
      box.className = 'status-box';
      box.style.display = 'none';
    }

    if (text) {
      const dauer = type === 'error' ? 5200 : (type === 'success' ? 3200 : 0);
      showToast(text, type, dauer);
    }
  }

  function showToast(message, type, durationMs) {
    const toast = document.getElementById('saveToast');
    if (!toast) return;

    if (saveToastTimer) {
      clearTimeout(saveToastTimer);
      saveToastTimer = null;
    }

    if (!message) {
      toast.textContent = '';
      toast.className = 'save-toast';
      return;
    }

    toast.textContent = message || '';
    toast.className = 'save-toast active ' + (type === 'success' ? 'success' : (type === 'error' ? 'error' : 'info'));

    if (durationMs && durationMs > 0) {
      saveToastTimer = setTimeout(function() {
        toast.className = 'save-toast';
      }, durationMs);
    }
  }

  function setBusy(isBusy, button, busyText) {
    if (!button) return;
    if (isBusy) {
      button.disabled = true;
      button.dataset.originalText = button.textContent;
      button.textContent = busyText || 'Bitte warten ...';
    } else {
      button.disabled = false;
      button.textContent = button.dataset.originalText || button.textContent;
    }
  }

  window.openZollKontakte = openZollKontakte;
  window.closeZollModal = closeZollModal;
  window.handleModalBackdropClick = handleModalBackdropClick;
  window.toggleDetails = toggleDetails;

</script>
</body>
