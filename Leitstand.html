<!DOCTYPE html>
<html>
<head>
  <base target="_self">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
      /* GitHub-Wrapper schneidet oben 80px ab, um den Google-Hinweis auszublenden.
         Dieser Ausgleich macht Überschrift und obere Buttons wieder sichtbar. */
      .main-frame {
        margin-top: 80px !important;
      }

    :root {
      --pink: #ff007f;
      --pink-dark: #800040;
      --neon: #00ff00;
      --bg-dark: #222222;
      --card-bg: #2a2a2a;
      --input-bg: #1a1a1a;
      --line: #444444;
      --text-soft: #bbbbbb;
      --neo-out: 12px 12px 24px #151515, -12px -12px 24px #333333;
      --neo-in: inset 8px 8px 16px #111111, inset -8px -8px 16px #3a3a3a;
      --danger: #8f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-dark);
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: 700;
    }

    body {
      padding: 8px;
      overflow-x: hidden;
    }

    .main-frame {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      background: var(--bg-dark);
      border-radius: 24px;
      box-shadow: var(--neo-out);
      padding: 12px;
      border: 1px solid #333333;
    }

    .header-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-dark);
      padding: 8px 0 10px;
      border-bottom: 1px solid #333333;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    #mainTitle {
      margin: 0;
      color: var(--pink);
      font-weight: 900;
      letter-spacing: 1.2px;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
      font-size: 21px;
      line-height: 1;
    }


    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0;
    }

    .topbar-menu-btn,
    .top-action-btn,
    .btn-inline,
    .btn-inline-secondary,
    .modal-close,
    .modal-btn {
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .topbar-menu-btn:hover,
    .top-action-btn:hover,
    .btn-inline:hover,
    .btn-inline-secondary:hover,
    .modal-close:hover,
    .modal-btn:hover {
      transform: translateY(-1px);
    }

    @keyframes zollPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 4px rgba(55,142,255,0.18), 0 0 16px rgba(55,142,255,1); }
      50% { opacity: 0.55; box-shadow: 0 0 0 7px rgba(55,142,255,0.08), 0 0 24px rgba(55,142,255,1); }
    }

    .topbar-menu-btn,
    .top-action-btn {
      min-height: 40px;
      padding: 9px 12px;
      font-size: 12px;
      line-height: 1;
    }

    .topbar-menu-btn {
      background: var(--card-bg);
      color: var(--neon);
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .topbar-menu-btn.back-webapp-btn {
      min-width: 190px;
    }

    .topbar-menu-btn.current-area-btn {
      color: #ffffff;
      background: linear-gradient(145deg, #333333, #171717);
      cursor: default;
      pointer-events: none;
      text-shadow: none;
    }

    .top-action-btn {
      background: #1f1f1f;
      color: #ffffff;
      position: relative;
    }

    .top-action-btn.protocol-btn {
      min-width: 180px;
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
      text-shadow: none;
    }

    .top-action-btn.zoll-btn {
      min-width: 118px;
      padding-left: 38px;
      background: #10233f;
      color: #ffffff;
      border: 1px solid rgba(55, 142, 255, 0.55);
      box-shadow: 0 0 0 1px rgba(55,142,255,0.16), var(--neo-out);
    }

    .top-action-btn.central-save-btn {
      min-width: 132px;
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
      color: #ffffff;
      text-shadow: none;
    }

    .top-action-btn.zoll-btn::before {
      content: "🚨";
      position: absolute;
      left: 11px;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      filter: hue-rotate(175deg) saturate(1.8);
      animation: zollPulse 1.2s ease-in-out infinite;
    }

    .header-panel {
      display: grid;
      grid-template-columns: minmax(250px, 360px) 1fr;
      gap: 10px;
      align-items: start;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: var(--neo-in);
      margin-bottom: 12px;
    }

    .header-panel label {
      color: var(--pink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .date-picker-block {
      display: grid;
      gap: 8px;
    }

    .date-display {
      width: 100%;
      max-width: 100%;
      background: var(--input-bg);
      color: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 900;
      box-shadow: var(--neo-in);
      outline: none;
      min-height: 38px;
    }

    .mini-calendar {
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid #3a3a3a;
    }

    .mini-calendar-head {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      gap: 6px;
      align-items: center;
    }

    .mini-calendar-month {
      text-align: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .mini-calendar-nav {
      min-height: 30px;
      border: none;
      border-radius: 10px;
      background: #1f1f1f;
      color: var(--neon);
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
    }

    .mini-calendar-weekdays,
    .mini-calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .mini-calendar-weekdays span {
      text-align: center;
      color: var(--text-soft);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mini-calendar-day {
      min-height: 29px;
      border: 1px solid #343434;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .mini-calendar-day.empty {
      visibility: hidden;
      cursor: default;
    }

    .mini-calendar-day.planned {
      background: #39ff14;
      color: #061306;
      border-color: #c7ffc7;
      box-shadow: 0 0 14px rgba(57, 255, 20, 0.85);
    }

    .mini-calendar-day.completed {
      background: #ffd84d;
      color: #1f1700;
      border-color: #fff1a8;
      box-shadow: 0 0 10px rgba(255, 216, 77, 0.65);
    }

    .mini-calendar-day.rejected {
      background: #ff1f1f;
      color: #ffffff;
      border-color: #ffd0d0;
      box-shadow: 0 0 14px rgba(255, 31, 31, 0.95);
    }

    .mini-calendar-day.selected {
      outline: 4px solid #ff6a00;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px rgba(255,106,0,0.55), 0 0 18px rgba(255,106,0,0.95);
    }

    .calendar-note {
      color: var(--text-soft);
      font-size: 10px;
      line-height: 1.15;
    }

    .header-panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-box {
      margin: 0 0 10px 0;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.2px;
      box-shadow: var(--neo-in);
      display: none;
    }

    .status-box.active {
      display: block;
    }

    .status-info {
      background: #1c1c1c;
      color: #dddddd;
    }

    .status-success {
      background: #11351d;
      color: #c8ffd4;
      border: 1px solid #39ff14;
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.45);
    }

    .status-error {
      background: #2a1118;
      color: #ffb6c9;
    }

    .save-toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%) translateY(24px);
      min-width: 240px;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-align: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      box-shadow: 0 16px 34px rgba(0,0,0,0.55);
    }

    .save-toast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .save-toast.info {
      background: #1c1c1c;
      color: #eeeeee;
      border: 1px solid #555555;
    }

    .save-toast.success {
      background: #12a139;
      color: #ffffff;
      border: 1px solid #9dffb1;
      box-shadow: 0 0 22px rgba(57, 255, 20, 0.65), 0 16px 34px rgba(0,0,0,0.55);
    }

    .save-toast.error {
      background: #7d1225;
      color: #ffffff;
      border: 1px solid #ffb6c9;
    }

    .container {
      display: grid;
      gap: 10px;
      padding-bottom: 18px;
    }



    /* Leitstand 2026: Kartenansicht nach freigegebenem Zielbild, ohne serverseitige Automationen zu verändern. */
    .leitstand-board {
      display: grid;
      grid-template-columns: minmax(260px, 34%) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .leitstand-sidebar,
    .leitstand-main {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .leitstand-panel,
    .brand-main-card,
    .protocol-preview-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      padding: 12px;
      min-width: 0;
    }

    .leitstand-panel-title {
      margin: 0 0 8px 0;
      color: var(--pink);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.35);
    }

    .brand-day-list {
      display: grid;
      gap: 8px;
    }

    .day-brand-card {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.18);
      color: #ffffff;
      padding: 10px;
      display: grid;
      gap: 5px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--neo-in);
    }

    .day-brand-card.active {
      border-color: var(--pink);
      box-shadow: 0 0 0 1px rgba(255,0,127,0.45), 0 0 18px rgba(255,0,127,0.45);
    }

    .day-brand-topline,
    .brand-headline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .brand-time {
      color: var(--pink);
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.45);
      white-space: nowrap;
    }

    .brand-owner-name {
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .day-brand-owner {
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .day-brand-meta {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .mini-folder-btn,
    .drive-open-btn,
    .zoll-open-btn,
    .protocol-action-btn,
    .brand-burn-btn,
    .brand-save-btn {
      border: none;
      border-radius: 12px;
      min-height: 38px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--neo-out);
      color: #ffffff;
    }

    .mini-folder-btn {
      min-width: 38px;
      padding: 6px;
      background: #202020;
      color: #ffd84d;
      border: 1px solid rgba(255,216,77,0.36);
    }

    .drive-open-btn {
      background: #202020;
      color: #ffd84d;
      border: 1px solid rgba(255,216,77,0.36);
      white-space: nowrap;
    }

    .drive-open-btn[disabled],
    .mini-folder-btn[disabled] {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .meta-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .meta-cell {
      min-width: 0;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .meta-label {
      color: var(--text-soft);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .meta-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 100%;
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: normal;
    }

    .status-pill.ok {
      color: #c6ffc6;
      background: rgba(0, 255, 0, 0.12);
      border: 1px solid rgba(0, 255, 0, 0.42);
    }

    .status-pill.pending {
      color: #ffffff;
      background: rgba(55, 142, 255, 0.15);
      border: 1px solid rgba(55, 142, 255, 0.45);
    }

    .status-pill.open {
      color: #dddddd;
      background: rgba(180, 180, 180, 0.13);
      border: 1px solid rgba(180, 180, 180, 0.35);
    }

    .status-pill.archive {
      color: #1f1700;
      background: #ffd84d;
      border: 1px solid #fff1a8;
    }

    .fass-section-title {
      margin: 12px 0 8px 0;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .fass-cards {
      display: grid;
      gap: 8px;
    }

    .fass-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 10px;
    }


    .fass-card.locked-other-brand {
      opacity: 0.62;
      border-color: rgba(255, 216, 77, 0.55);
      background: rgba(255, 216, 77, 0.07);
    }

    .fass-lock-note {
      grid-column: 1 / -1;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 216, 77, 0.10);
      border: 1px solid rgba(255, 216, 77, 0.55);
      color: #ffd84d;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
    }

    .fass-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--pink);
      border: 1px solid rgba(255,0,127,0.32);
      background: rgba(255,0,127,0.08);
      font-size: 26px;
      line-height: 1;
    }

    .fass-body {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .fass-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fass-title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .fass-type-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0,255,0,0.12);
      border: 1px solid rgba(0,255,0,0.38);
      color: #c6ffc6;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .fass-type-chip.split {
      background: rgba(255,216,77,0.14);
      border-color: rgba(255,216,77,0.62);
      color: #ffd84d;
    }

    .fass-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .fass-anteil-list {
      display: grid;
      gap: 8px;
    }

    .fass-anteil-box {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .fass-split-note {
      grid-column: 1 / -1;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 216, 77, 0.10);
      border: 1px solid rgba(255, 216, 77, 0.75);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .fass-card-actions {
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .mini-check.fass-check {
      max-width: none;
      white-space: nowrap;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .brand-action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .brand-save-btn {
      background: #202020;
      border: 1px solid rgba(255,255,255,0.24);
    }

    .brand-burn-btn {
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
    }

    .brand-extra-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .fass-action-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .fass-action-row .mini-check {
      width: 100%;
      max-width: none;
      min-height: 42px;
      font-size: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .fass-action-row .mini-check input {
      width: 18px;
      height: 18px;
      flex-basis: 18px;
    }

    .lower-dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
      align-items: start;
    }

    .protocol-paper {
      background: #ffffff;
      color: #111111;
      border-radius: 12px;
      padding: 18px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      gap: 8px;
      min-height: 220px;
    }

    .protocol-paper-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .protocol-line {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
    }

    .protocol-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      margin-top: 4px;
    }

    .protocol-table th,
    .protocol-table td {
      border: 1px solid #777777;
      padding: 5px;
      text-align: left;
    }

    .protocol-button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .protocol-action-btn,
    .zoll-open-btn {
      background: #202020;
      border: 1px solid rgba(255,255,255,0.24);
    }

    .protocol-action-btn.primary {
      background: linear-gradient(145deg, var(--pink), var(--pink-dark));
    }

    .empty-leitstand {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);

              <button class="mini-calendar-nav" type="button" onclick="wechselKalenderMonat(-1)">‹</button>

            <div class="mini-calendar-days" id="calendarDays"></div>

<script>
  const webAppUrl = <?= JSON.stringify(webAppUrl || '') ?>;
  const GITHUB_INDEX_URL = 'https://fraumecker.github.io/brennerei-startogv/';
  const GITHUB_ADMIN_URL = 'https://fraumecker.github.io/brennerei-startogv/admin.html';
  const returnModus = <?= JSON.stringify(typeof returnModus !== 'undefined' ? returnModus : '') ?>;
  const originModus = <?= JSON.stringify(typeof originModus !== 'undefined' ? originModus : '') ?>;
  const istAdminRuecksprung = <?= (typeof istAdminRuecksprung !== 'undefined' && istAdminRuecksprung) ? 'true' : 'false' ?>;
  const zollKontaktBootstrap = <?= (typeof zollKontaktlisteJson !== 'undefined' && zollKontaktlisteJson) ? zollKontaktlisteJson : 'null' ?>;
  const ZOLL_KONTAKT_FALLBACK = {
    titel: 'Hauptzollamt Saarbrücken',
    untertitel: 'Telefonliste Steueraufsicht Abfindungsbrennereien',
    stand: '19. Januar 2026',

      { name: 'Müller', dienstsitz: 'SB', telefon: '0681/8308-0670', mobil: '0175-1168740', email: 'leon.mueller@zoll.bund.de' },
      { name: 'Becker', dienstsitz: 'KL', telefon: '', mobil: '0160-98033505', email: 'tobias.becker@zoll.bund.de' },
