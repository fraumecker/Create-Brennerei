  <style>

  </style>
</head>
<body>
  <div class="main-frame">
    <div class="archiv-shell">
      <h1>OGV BREITFURT – JAHRESARCHIV-ÜBERSICHT</h1>

      <div class="archiv-card no-print">
        <div class="archiv-grid">
          <div class="archiv-field">
            <label for="stoffbesitzerAuswahl">Stoffbesitzer auswählen</label>
            <select id="stoffbesitzerAuswahl" class="archiv-select" onchange="stoffbesitzerAusDropdownUebernehmen()">
              <option value="">Bitte auswählen</option>
            </select>
          </div>

          <div class="archiv-field">
            <label for="stoffbesitzerSuche">Stoffbesitzer suchen</label>
            <input id="stoffbesitzerSuche" class="archiv-input" type="text" placeholder="Name eingeben">
          </div>

          <div class="archiv-field">
            <label for="jahrAuswahl">Jahr</label>
            <select id="jahrAuswahl" class="archiv-select">
              <option value="">Alle Jahresarchive</option>
            </select>
          </div>

          <button class="archiv-btn" type="button" onclick="datenLaden()">Anzeigen</button>
          <button class="archiv-btn secondary" type="button" onclick="window.print()">Drucken</button>
          <a id="driveOrdnerLink" class="archiv-link-btn secondary disabled" href="#" target="_blank" rel="noopener">Drive-Ordner öffnen</a>
        </div>

        <div class="archiv-actions-bottom">
          <button class="archiv-btn secondary" type="button" onclick="listeLeeren()">Liste leeren</button>
          <button class="archiv-btn secondary" type="button" onclick="zurueckZumAdmin()">Zurück zum Admin-Hauptmenü</button>
        </div>

        <div id="status" class="archiv-status" style="margin-top: 12px;"></div>
      </div>

      <div class="archiv-card">
        <div id="summary" class="archiv-summary"></div>
      </div>

      <div class="archiv-card archiv-table-wrap">
        <table class="archiv-table">
          <thead>
            <tr>
              <th>Stoffbesitzer</th>
              <th>Registernummer</th>
              <th>Brandtag</th>
              <th>Material</th>
              <th>Ausbeute</th>
              <th>Jahr</th>
              <th>Archivblatt</th>
            </tr>
          </thead>
          <tbody id="ergebnisBody">
            <tr><td class="archiv-empty" colspan="7">Bitte Stoffbesitzer auswählen oder eingeben.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const WEBAPP_URL = '<?= webAppUrl ?>';
    let letzteDaten = null;

    document.addEventListener('DOMContentLoaded', function() {
      initialdatenLaden();
    });

    function initialdatenLaden() {
      statusSetzen('Jahresarchive werden gelesen.');
      google.script.run
        .withSuccessHandler(function(res) {
          letzteDaten = res;
          auswahllistenRendern(res);
          ergebnisseRendern(res);
          statusSetzen('Bereit. Bitte Stoffbesitzer auswählen oder eingeben.');
        })
        .withFailureHandler(function(err) {
          statusSetzen('Fehler beim Laden: ' + fehlermeldung(err));
          ergebnisseRendern({ zeilen: [], stoffbesitzerAuswahlErforderlich: true });
        })
        .jahresarchivUebersichtInitialdatenLaden();
    }

    function datenLaden() {
      const stoffbesitzer = document.getElementById('stoffbesitzerSuche').value.trim();
      const jahr = document.getElementById('jahrAuswahl').value.trim();

      if (!stoffbesitzer) {
        statusSetzen('Bitte zuerst einen Stoffbesitzer auswählen oder eingeben.');
        ergebnisseRendern({
          zeilen: [],
          archivblaetter: letzteDaten && letzteDaten.archivblaetter ? letzteDaten.archivblaetter : [],
          stoffbesitzerListe: letzteDaten && letzteDaten.stoffbesitzerListe ? letzteDaten.stoffbesitzerListe : [],
          jahre: letzteDaten && letzteDaten.jahre ? letzteDaten.jahre : [],
          stoffbesitzerAuswahlErforderlich: true
        });
        return;
      }

      statusSetzen('Übersicht wird geladen.');

      google.script.run
        .withSuccessHandler(function(res) {
          letzteDaten = res;
          auswahllistenRendern(res);
          ergebnisseRendern(res);
          statusSetzen((res.anzahl || 0) + ' Einträge gefunden.');
        })
        .withFailureHandler(function(err) {
          statusSetzen('Fehler beim Laden: ' + fehlermeldung(err));
        })
        .jahresarchivUebersichtDatenLaden({ stoffbesitzer: stoffbesitzer, jahr: jahr });
    }

    function auswahllistenRendern(res) {
      res = res || {};
      const stoffbesitzerAuswahl = document.getElementById('stoffbesitzerAuswahl');
      const jahrAuswahl = document.getElementById('jahrAuswahl');
      const stoffAktuell = document.getElementById('stoffbesitzerSuche').value.trim();
      const jahrAktuell = jahrAuswahl.value;

      stoffbesitzerAuswahl.innerHTML = '<option value="">Bitte auswählen</option>';
      (res.stoffbesitzerListe || []).forEach(function(name) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        stoffbesitzerAuswahl.appendChild(opt);
      });
      stoffbesitzerAuswahl.value = stoffAktuell;

      jahrAuswahl.innerHTML = '<option value="">Alle Jahresarchive</option>';
      (res.jahre || []).forEach(function(jahr) {
        const opt = document.createElement('option');
        opt.value = jahr;
        opt.textContent = jahr;
        jahrAuswahl.appendChild(opt);
      });
      jahrAuswahl.value = jahrAktuell;
    }

    function stoffbesitzerAusDropdownUebernehmen() {
      const auswahl = document.getElementById('stoffbesitzerAuswahl').value.trim();
      document.getElementById('stoffbesitzerSuche').value = auswahl;
      if (auswahl) datenLaden();
    }

    function ergebnisseRendern(res) {
      res = res || {};
      const body = document.getElementById('ergebnisBody');
      const summary = document.getElementById('summary');
      const zeilen = res.zeilen || [];
      const stoff = document.getElementById('stoffbesitzerSuche').value.trim();

      driveLinkAktualisieren(res.driveOrdnerUrl || '');

      summary.innerHTML = '';
      summary.appendChild(chipErstellen('Einträge: ' + zeilen.length));
      summary.appendChild(chipErstellen('Archivblätter: ' + ((res.archivblaetter || []).length)));
      if (stoff) {
        summary.appendChild(chipErstellen('Stoffbesitzer: ' + stoff));
      }
      if (document.getElementById('jahrAuswahl').value.trim()) {
        summary.appendChild(chipErstellen('Jahr: ' + document.getElementById('jahrAuswahl').value.trim()));
      }
      if (res.driveOrdnerUrl) {
        summary.appendChild(chipErstellen('Drive-Ordner: vorhanden'));
      } else if (stoff) {
        summary.appendChild(chipErstellen('Drive-Ordner: nicht gefunden'));
      }

      if (!stoff || res.stoffbesitzerAuswahlErforderlich) {
        body.innerHTML = '<tr><td class="archiv-empty" colspan="7">Bitte Stoffbesitzer auswählen oder eingeben. Es werden nicht alle Archivdaten gesammelt angezeigt.</td></tr>';
        return;
      }

      if (!zeilen.length) {
        body.innerHTML = '<tr><td class="archiv-empty" colspan="7">Keine Einträge für diesen Stoffbesitzer gefunden.</td></tr>';
        return;
      }

      body.innerHTML = '';
      zeilen.forEach(function(z) {
        const tr = document.createElement('tr');
        ['stoffbesitzer', 'registernummer', 'brandtag', 'material', 'ausbeute', 'jahr', 'archivblatt'].forEach(function(key) {
          const td = document.createElement('td');
          td.textContent = z[key] || '';
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function driveLinkAktualisieren(url) {
      const link = document.getElementById('driveOrdnerLink');
      if (url) {
        link.href = url;
        link.classList.remove('disabled');
        link.textContent = 'Drive-Ordner öffnen';
      } else {
        link.href = '#';
        link.classList.add('disabled');
        link.textContent = 'Drive-Ordner nicht gefunden';
      }
    }

    function chipErstellen(text) {
      const div = document.createElement('div');
      div.className = 'archiv-chip';
      div.textContent = text;
      return div;
    }

    function listeLeeren() {
      document.getElementById('stoffbesitzerSuche').value = '';
      document.getElementById('stoffbesitzerAuswahl').value = '';
      document.getElementById('jahrAuswahl').value = '';
      driveLinkAktualisieren('');
      ergebnisseRendern({
        zeilen: [],
        archivblaetter: letzteDaten && letzteDaten.archivblaetter ? letzteDaten.archivblaetter : [],
        stoffbesitzerListe: letzteDaten && letzteDaten.stoffbesitzerListe ? letzteDaten.stoffbesitzerListe : [],
        jahre: letzteDaten && letzteDaten.jahre ? letzteDaten.jahre : [],
        stoffbesitzerAuswahlErforderlich: true
      });
      statusSetzen('Liste geleert. Bitte Stoffbesitzer auswählen oder eingeben.');
    }

    function zurueckZumAdmin() {
      window.top.location.href = 'https://fraumecker.github.io/brennerei-startogv/admin.html';
    }

    function statusSetzen(text) {
      document.getElementById('status').textContent = text || '';
    }

    function fehlermeldung(err) {
      if (!err) return 'Unbekannter Fehler';
      return err.message || String(err);
    }
  </script>
</body>
</html>
