    <script>
      const START_MODUS = '<?!= typeof startModus !== "undefined" ? startModus : "" ?>';
      const RETURN_MODUS = '<?!= typeof returnModus !== "undefined" ? returnModus : "" ?>';
      const ORIGIN_MODUS = '<?!= typeof originModus !== "undefined" ? originModus : "" ?>';
      const IST_ADMIN_RUECKSPRUNG = <?!= typeof istAdminRuecksprung !== "undefined" && istAdminRuecksprung ? 'true' : 'false' ?>;
      const WEBAPP_URL = '<?!= typeof webAppUrl !== "undefined" ? webAppUrl : "" ?>';
      const GITHUB_INDEX_URL = 'https://fraumecker.github.io/brennerei-startogv/';
      const GITHUB_ADMIN_URL = 'https://fraumecker.github.io/brennerei-startogv/admin.html';
      const IST_COCKPIT_RUECKSPRUNG = String(ORIGIN_MODUS || '').toLowerCase() === 'cockpit' || String(RETURN_MODUS || '').toLowerCase() === 'cockpit';
      let busy = false;
      let toastTimer = null;

      let stoffbesitzerListe = [];
      let maischeVorgaenge = [];
      let maischeBrennerListe = [];
      let maischeZollStatusListe = [];
      let maischeFassgroessenListe = [];
      let maischeMaterialListe = [];
      let maischeGewuerzeListe = [];
      let maischeSlotIndex = 0;
      let prozessModus = 'vorgang';

      function escapeHtml(text) {
        if (text == null) return '';
        return String(text).replace(/[&<>"']/g, function(m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      function leseFehler(err) {
        return err && err.message ? err.message : String(err || 'Unbekannter Fehler');
      }

      function heuteIso() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }

      function optionenHtml(liste, selectedValue, placeholder) {
        const selected = String(selectedValue || '').trim();
        let html = '<option value="">' + escapeHtml(placeholder || 'Bitte wählen') + '</option>';

        (liste || []).forEach(function(item) {
          const value = typeof item === 'string' ? item : String(item.value || '');
          const label = typeof item === 'string' ? item : String(item.label || item.value || '');
          if (!String(value || '').trim()) return;
          html += '<option value="' + escapeHtml(value) + '"' + (value === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
        });

        return html;
      }

      function stoffbesitzerEintragWert(item) {
        return typeof item === 'string' ? item : String(item && item.value || '');
      }

      function stoffbesitzerEintragLabel(item) {
        return typeof item === 'string' ? item : String(item && (item.label || item.value) || '');
      }

      function stoffbesitzerVorschlaegeAktualisieren(istEingabe) {
        const eingabe = document.getElementById('stoffbesitzerSuche');
        const ziel = document.getElementById('stoffbesitzerVorschlaege');
        const hidden = document.getElementById('stoffbesitzer');
        if (!eingabe || !ziel || !hidden) return;

        const suchtextOriginal = String(eingabe.value || '').trim();
        const suchtext = suchtextOriginal.toLowerCase();
        ziel.innerHTML = '';

        if (istEingabe) {
          hidden.value = '';
        }

        if (suchtext.length < 2) {
          ziel.classList.remove('open');
          return;
        }

        const treffer = (stoffbesitzerListe || []).filter(function(item) {
          const value = stoffbesitzerEintragWert(item);
          const label = stoffbesitzerEintragLabel(item);
          const suchbasis = String(value + ' ' + label).toLowerCase();
          return suchbasis.indexOf(suchtext) >= 0;
        }).slice(0, 20);

        if (!treffer.length) {
          ziel.innerHTML = '<div class="stoffbesitzer-hinweis">Kein passender Stoffbesitzer gefunden.</div>';
          ziel.classList.add('open');
          return;
        }

        treffer.forEach(function(item) {
          const value = stoffbesitzerEintragWert(item);
          const label = stoffbesitzerEintragLabel(item) || value;
          if (!String(value || '').trim()) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'stoffbesitzer-vorschlag';
          btn.textContent = label;
          btn.onclick = function() {
            hidden.value = value;
            eingabe.value = label;
            ziel.classList.remove('open');
            ziel.innerHTML = '';
          };
          ziel.appendChild(btn);
        });

        ziel.classList.add('open');
      }

      function stoffbesitzerAuswahlZuruecksetzen() {
        const hidden = document.getElementById('stoffbesitzer');
        const eingabe = document.getElementById('stoffbesitzerSuche');
        const ziel = document.getElementById('stoffbesitzerVorschlaege');
        if (hidden) hidden.value = '';
        if (eingabe) eingabe.value = '';
        if (ziel) {
          ziel.classList.remove('open');
          ziel.innerHTML = '';
        }
      }

      document.addEventListener('click', function(event) {
        const wrap = event.target && event.target.closest ? event.target.closest('.stoffbesitzer-suche-wrap') : null;
        if (wrap) return;
        const ziel = document.getElementById('stoffbesitzerVorschlaege');
        if (ziel) ziel.classList.remove('open');
      });


      function checkboxGruppeHtml(liste, selectedValues, klasse, titel) {
        const selected = Array.isArray(selectedValues) ? selectedValues.map(function(v) { return String(v || '').trim(); }) : [];
        let optionen = '';
        (liste || []).forEach(function(item, i) {
          const value = typeof item === 'string' ? item : String(item.value || '');
          const label = typeof item === 'string' ? item : String(item.label || item.value || '');
          if (!String(value || '').trim()) return;
          const id = klasse + '_' + Math.random().toString(36).slice(2) + '_' + i;
          const checked = selected.indexOf(value) >= 0;
          optionen += '<label class="check-chip' + (checked ? ' selected' : '') + '" for="' + escapeHtml(id) + '" data-suchtext="' + escapeHtml((label + ' ' + value).toLowerCase()) + '">' +
            '<input id="' + escapeHtml(id) + '" type="checkbox" class="' + escapeHtml(klasse) + '" value="' + escapeHtml(value) + '"' + (checked ? ' checked' : '') + ' onchange="multiPickerGeaendert(this)">' +
            '<span>' + escapeHtml(label) + '</span></label>';
        });
        if (!optionen) optionen = '<div class="multi-picker-hint">Keine Werte geladen</div>';
        return '<div class="multi-picker-input-wrap"><input type="text" class="multi-picker-input" placeholder="' + escapeHtml((titel || 'Auswahl') + ' eintippen') + '" onfocus="multiPickerVorbereiten(this)" onclick="multiPickerVorbereiten(this)" oninput="multiPickerFilternAusInput(this)" autocomplete="off"></div>' +
          '<div class="multi-picker-panel"><div class="multi-picker-hint">Suchbegriff eintippen, dann Wert anklicken.</div><div class="multi-picker-options">' + optionen + '</div></div>';
      }

      function multiPickerVorbereiten(input) {
        if (busy) return;
        const picker = input.closest('.multi-picker');
        if (!picker) return;
        document.querySelectorAll('.multi-picker.open').forEach(function(offen) { if (offen !== picker) { offen.classList.remove('open'); aktualisiereMultiPicker(offen); } });
        if (input.classList.contains('has-selection')) { input.value = ''; input.classList.remove('has-selection'); }
        multiPickerFilternAusInput(input);
      }

      function multiPickerFilternAusInput(input) {
        const picker = input.closest('.multi-picker');
        if (!picker) return;
        const suchtext = String(input.value || '').trim().toLowerCase();
        let sichtbar = 0;
        picker.querySelectorAll('.check-chip').forEach(function(chip) {
          const cb = chip.querySelector('input[type="checkbox"]');
          const basis = chip.getAttribute('data-suchtext') || chip.textContent.toLowerCase();
          const passt = suchtext ? basis.indexOf(suchtext) >= 0 : (cb && cb.checked);
          chip.style.display = passt ? 'flex' : 'none';
          if (passt) sichtbar++;
        });
        let leer = picker.querySelector('.multi-picker-empty');
        if (!leer) { leer = document.createElement('div'); leer.className = 'multi-picker-hint multi-picker-empty'; picker.querySelector('.multi-picker-panel').appendChild(leer); }
        if (suchtext.length > 0 && suchtext.length < 3) {
          picker.querySelectorAll('.check-chip').forEach(function(chip) { chip.style.display = 'none'; });
          leer.textContent = 'Mindestens 3 Buchstaben eintippen.';
          leer.style.display = 'block';
          picker.classList.add('open');
          return;
        }
        if (!suchtext && sichtbar === 0) { leer.textContent = 'Bitte mindestens 3 Buchstaben eintippen.'; leer.style.display = 'block'; picker.classList.add('open'); return; }
        if (suchtext && sichtbar === 0) { leer.textContent = 'Kein passender Wert gefunden.'; leer.style.display = 'block'; } else { leer.style.display = 'none'; }
        picker.classList.add('open');
      }

      function multiPickerGeaendert(input) {
        const picker = input.closest('.multi-picker');
        if (!picker) return;
        const chip = input.closest('.check-chip');
        if (chip) { if (input.checked) chip.classList.add('selected'); else chip.classList.remove('selected'); }
        aktualisiereMultiPicker(picker);
        picker.classList.remove('open');
        aktualisiereFeldOptik(document.getElementById('bereichMaischeannahme') || document);
      }

      function aktualisiereMultiPicker(picker) {
        const input = picker.querySelector('.multi-picker-input');
        const checked = Array.prototype.slice.call(picker.querySelectorAll('input[type="checkbox"]:checked')).map(function(el) { return el.value; }).filter(Boolean);
        const titel = picker.getAttribute('data-titel') || 'Auswahl';
        picker.querySelectorAll('.check-chip').forEach(function(chip) { const cb = chip.querySelector('input[type="checkbox"]'); if (cb && cb.checked) chip.classList.add('selected'); else chip.classList.remove('selected'); chip.style.display = 'flex'; });
        const leer = picker.querySelector('.multi-picker-empty'); if (leer) leer.style.display = 'none';
        if (!input) return;
        if (!checked.length) { input.value = ''; input.placeholder = titel + ' eintippen'; input.classList.remove('has-selection'); }
        else if (checked.length <= 2) { input.value = checked.join(' | '); input.classList.add('has-selection'); }
        else { input.value = checked.length + ' ausgewählt'; input.classList.add('has-selection'); }
      }

      function aktualisiereMultiPickerInRoot(root) { root.querySelectorAll('.multi-picker').forEach(function(picker) { aktualisiereMultiPicker(picker); }); }

      function splitMehrfachWert(text) { const roh = String(text || '').trim(); if (!roh) return []; return roh.split(/\s*\|\s*|\s*,\s*/).map(function(v) { return String(v || '').trim(); }).filter(Boolean); }
      function checkboxGruppeWerte(root, klasse) { return Array.prototype.slice.call(root.querySelectorAll('input.' + klasse + ':checked')).map(function(el) { return el.value; }).filter(Boolean); }

      function setBusy(status) {
        busy = !!status;

        document.querySelectorAll('button').forEach(function(btn) {
          if (btn.classList.contains('toast-close')) return;
          btn.disabled = busy;
        });

        document.querySelectorAll('select').forEach(function(sel) {
          sel.disabled = busy;
        });

        document.querySelectorAll('input').forEach(function(inp) {
          if (inp.readOnly) return;
          inp.disabled = busy;
        });

        document.querySelectorAll('textarea').forEach(function(ta) {
          if (ta.readOnly) return;
          ta.disabled = busy;
        });
      }

      function zeigeToast(text, typ, optionen) {
        const box = document.getElementById('toastBox');
        const opts = optionen || {};
        if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
        if (!text) { box.style.display = 'none'; box.innerHTML = ''; box.className = ''; return; }
        const art = typ || 'info';
        const meldung = String(text || '');
        const istLadevorgang = /wird|werden|lädt|geladen …|speichert|neu geladen/i.test(meldung);
        const hatOk = opts.mitOk === true;
        const autoMs = opts.autoMs === undefined ? (istLadevorgang || hatOk ? 0 : (art === 'ok' ? 11000 : (art === 'error' ? 20000 : 10000))) : Number(opts.autoMs || 0);
        box.className = art;
        box.innerHTML = '<div class="toast-text">' + escapeHtml(text) + '</div>' + (hatOk ? '<button type="button" class="toast-close" onclick="zeigeToast(\'\', \'info\')">OK</button>' : '');
        box.style.display = 'block';
        if (autoMs > 0) toastTimer = setTimeout(function() { zeigeToast('', 'info'); }, autoMs);
      }

      function zeigeStatus(boxId, text, typ) {
        const box = document.getElementById(boxId);
        if (!box) return;

        const meldung = String(text || '');
        const istLadevorgang = /wird|werden|lädt|geladen …|speichert/i.test(meldung);
        const istNurBedienhinweis = /Bitte Vorgang auswählen/i.test(meldung);

        if (!text) {
          box.style.display = 'none';
          box.innerHTML = '';
          zeigeToast('', 'info');
          return;
        }

        if (istLadevorgang) {
          box.style.display = 'none';
          box.innerHTML = '';
          zeigeToast(meldung, typ || 'info', { autoMs: 0 });
          return;
        }

        if (istNurBedienhinweis) {
          box.style.display = 'none';
          box.innerHTML = '';
          return;
        }

        box.style.display = 'block';
        box.className = 'card';
        box.innerHTML = '<b>' + escapeHtml(text) + '</b>';
        if (typ === 'error') zeigeToast(text, 'error');
        else if (typ === 'ok') zeigeToast(text, 'ok');
      }

      function alleBereicheSchliessen() {
        document.getElementById('startUebersicht').style.display = 'none';
        document.getElementById('bereichVorplanung').style.display = 'none';
        document.getElementById('bereichMaischeannahme').style.display = 'none';
      }

      function zeigeStartUebersicht() {
        alleBereicheSchliessen();
        document.getElementById('startUebersicht').style.display = 'block';
        document.getElementById('mainTitle').textContent = 'OGV BREITFURT – WEB APP';
        zeigeStatus('statusBoxVorplanung', '', 'info');
        zeigeStatus('statusBoxMaische', '', 'info');
      }

      function zeigeVorplanung() {
        alleBereicheSchliessen();
        document.getElementById('bereichVorplanung').style.display = 'block';
        document.getElementById('mainTitle').textContent = 'OGV BREITFURT – VORPLANUNG';
      }

      function wendeProzessModusAn() {
        prozessModus = 'vorgang';
        document.getElementById('prozessModus').value = prozessModus;
        document.getElementById('maischeBereichTitel').textContent = 'Vorgangsbearbeitung';
        document.getElementById('mainTitle').textContent = 'OGV BREITFURT – VORGANG BEARBEITEN';
        document.getElementById('blockRegistriernummer').style.display = 'block';
        document.getElementById('btnSpeichernMaischebereich').textContent = 'Vorgang speichern';
        document.getElementById('maischeZollOkGlobal').disabled = false;
      }

      function zeigeMaischeannahme() {
        prozessModus = 'vorgang';
        alleBereicheSchliessen();
        document.getElementById('bereichMaischeannahme').style.display = 'block';
        wendeProzessModusAn();
      }

      function zeigeBrennfreigabe() {
        zeigeMaischeannahme();
      }


      function zielModusFuerRuecksprung() {
        const istAdmin = IST_ADMIN_RUECKSPRUNG ||
          String(ORIGIN_MODUS || '').toLowerCase() === 'admin' ||
          String(RETURN_MODUS || '').toLowerCase() === 'admin';

        if (istAdmin) return 'admin';
        if (IST_COCKPIT_RUECKSPRUNG) return 'index';
        return '';
      }

      function geheZurueckZumHauptmenue() {
        const zielModus = zielModusFuerRuecksprung();

        if (zielModus === 'admin') {
          window.top.location.href = GITHUB_ADMIN_URL;
          return;
        }

        if (zielModus === 'index') {
          window.top.location.href = GITHUB_INDEX_URL;
          return;
        }

        zeigeStartUebersicht();
      }

      function nachSpeichernZurueckInsHauptmenue() {
        zeigeToast('', 'info');
        geheZurueckZumHauptmenue();
      }

      function zurueckOderUebersicht() {
        zeigeToast('', 'info');
        geheZurueckZumHauptmenue();
      }

      function formularLeerenVorplanung() {
        document.getElementById('vorgangsId').value = '';
        stoffbesitzerAuswahlZuruecksetzen();
        document.getElementById('anrufDatum').value = heuteIso();
        document.getElementById('bemerkung').value = '';
      }

      function oeffneVorplanung() {
        if (busy) return;

        setBusy(true);
        zeigeStatus('statusBoxVorplanung', 'Vorplanung wird geladen …', 'info');

        google.script.run
          .withSuccessHandler(function(data) {
            setBusy(false);
            stoffbesitzerListe = data && Array.isArray(data.stoffbesitzer) ? data.stoffbesitzer : [];
            formularLeerenVorplanung();
            zeigeVorplanung();
            zeigeStatus('statusBoxVorplanung', '', 'info');
          })
          .withFailureHandler(function(err) {
            setBusy(false);
            zeigeVorplanung();
            zeigeStatus('statusBoxVorplanung', 'Dropdowns konnten nicht geladen werden: ' + leseFehler(err), 'error');
          })
          .ladeVorplanungDropdowns();
      }

      function payloadLesenVorplanung() {
        return {
          vorgangsId: document.getElementById('vorgangsId').value.trim(),
          stoffbesitzer: document.getElementById('stoffbesitzer').value,
          anrufDatum: document.getElementById('anrufDatum').value,
          bemerkung: document.getElementById('bemerkung').value.trim()
        };
      }

      function validiereVorplanung(payload) {
        if (!payload.stoffbesitzer) {
          zeigeStatus('statusBoxVorplanung', 'Stoffbesitzer fehlt.', 'error');
          return false;
        }

        if (!payload.anrufDatum) {

      function extrahiereFassanteileAusText(text) {
        const roh = String(text || '').trim();
        if (!roh) return [];
        const lines = roh.split(/\r?\n/);
        const anteile = [];
        lines.forEach(function(line) {
          const zeile = String(line || '').trim();
          if (!zeile) return;

          let match = zeile.match(/^[-•]?\s*Fass\s+(.+?)\s*\|\s*Fassvolumen:\s*(.*?)\s*\|\s*Fassinhalt:\s*(.*?)\s*\|\s*Material:\s*(.*?)\s*\|\s*Gewürze:\s*(.*?)\s*\|\s*Entnahme:\s*(.*?)\s*\|\s*Rest:\s*(.*?)\s*\|\s*Zuordnung:\s*(.*)$/i);
          if (match) {
            anteile.push({
              fassnummer: String(match[1] || '').trim(),
              fassvolumen: String(match[2] || '').trim(),
              fassinhalt: String(match[3] || '').trim(),
              material: String(match[4] || '').trim(),
              gewuerze: String(match[5] || '').trim(),
              entnahme: String(match[6] || '').trim(),
              rest: String(match[7] || '').trim(),
              zuordnung: String(match[8] || '').trim()
            });
            return;
          }

          match = zeile.match(/^[-•]?\s*Fass\s+(.+?)\s*\|\s*Gesamt:\s*(.*?)\s*\|\s*Entnahme:\s*(.*?)\s*\|\s*Rest:\s*(.*?)\s*\|\s*Zuordnung:\s*(.*)$/i);
          if (match) {
            anteile.push({
              fassnummer: String(match[1] || '').trim(),
              fassvolumen: '',
              fassinhalt: String(match[2] || '').trim(),
              material: '',
              gewuerze: '',
              entnahme: String(match[3] || '').trim(),
              rest: String(match[4] || '').trim(),
              zuordnung: String(match[5] || '').trim()
            });
          }
        });
        return anteile;
      }

      function entferneFassanteileBlockAusText(text) {
        const roh = String(text || '');
        if (!roh.trim()) return '';
        return roh
          .split(/\r?\n/)
          .filter(function(line) {
            const zeile = String(line || '').trim();
            if (!zeile) return true;
            if (/^FASSANTEILE_DIESES_BRANDS\s*:/i.test(zeile)) return false;
            if (/^[-•]?\s*Fass\s+.+?\s*\|\s*Fassvolumen:\s*.*?\s*\|\s*Fassinhalt:/i.test(zeile)) return false;
            if (/^[-•]?\s*Fass\s+.+?\s*\|\s*Gesamt:\s*.*?\s*\|\s*Entnahme:/i.test(zeile)) return false;
            if (/^Entnahme\s+für\s+diesen\s+Brand\s*:/i.test(zeile)) return false;
            return true;
          })
          .join('\n')
          .trim();
      }

      function fassSchluesselNormalisieren(wert) {
        return String(wert || '')
          .trim()
          .replace(/^Fass\s+/i, '')
          .replace(/\s+/g, ' ')
          .toLowerCase();
      }

      function wertJeFassAusSammelfeld(sammelwert) {
        const text = String(sammelwert || '').trim();
        const map = {};
        if (!text) return map;

        text.split(/\s*\|\s*/).forEach(function(teil) {
          const segment = String(teil || '').trim();
          if (!segment) return;

          const match = segment.match(/^\s*(?:Fass\s*)?([^:]+?)\s*:\s*(.*?)\s*$/i);
          if (!match) return;

          const schluessel = fassSchluesselNormalisieren(match[1]);
          const wert = String(match[2] || '').trim();
          if (schluessel) map[schluessel] = wert;
        });

        return map;
      }

      function wertFuerFassAusSammelfeld(sammelwert, fassnummer, gesamtzahl) {
        const text = String(sammelwert || '').trim();
        if (!text) return '';

        const map = wertJeFassAusSammelfeld(text);
        const keys = Object.keys(map);
        const key = fassSchluesselNormalisieren(fassnummer);

        if (key && Object.prototype.hasOwnProperty.call(map, key)) {
          return map[key];
        }

        if (keys.length > 0) {
          return '';
        }

        if (gesamtzahl === 1) {
          return text;
        }

        return '';
      }

      function fuelleFassanteile(slotRoot, data) {
        const container = slotRoot ? slotRoot.querySelector('.fassanteile-container') : null;
        if (!container) return;
        container.innerHTML = '';

        let anteile = extrahiereFassanteileAusText(data && data.fassSplittung);

        if (!anteile.length) {
          const fassListe = String(data && data.fassnummern || '')
            .split(/\s*\/\s*|\s*,\s*|\s*;\s*/)
            .map(function(v) { return String(v || '').trim(); })
            .filter(Boolean);

          if (fassListe.length) {
            anteile = fassListe.map(function(fass) {
              return {
                fassnummer: fass,
                fassvolumen: wertFuerFassAusSammelfeld(data && data.fassgroesse, fass, fassListe.length),
                fassinhalt: wertFuerFassAusSammelfeld(data && data.inhalt, fass, fassListe.length),
                material: data && data.material || '',
                gewuerze: data && data.gewuerze || '',
                entnahme: '',
                rest: '',
                zuordnung: ''
              };
            });
          }
        }

        if (!anteile.length) anteile = [{ fassnummer: '', fassvolumen: '', fassinhalt: '', material: '', gewuerze: '', entnahme: '', rest: '', zuordnung: '' }];

        anteile.forEach(function(anteil) {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = baueFassanteilZeileHtml(anteil);
          const row = wrapper.firstChild;
          container.appendChild(row);
          initialisiereFassanteilAuswahl(row, anteil);
        });
      }

        const block = document.getElementById('blockZollAblehnungBemerkung');

      function normalisiereUhrzeitEingabe(wert) {
        let text = String(wert || '').trim().toLowerCase();
        if (!text) return '';

        text = text
          .replace(/uhr/g, '')
          .replace(/[^0-9:.,]/g, '')
          .replace(/[.,]/g, ':')
          .trim();

        if (/^\d{1,2}$/.test(text)) {
          return String(Number(text)).padStart(2, '0') + ':00';
        }

        if (/^\d{3}$/.test(text)) {
          return '0' + text.substring(0, 1) + ':' + text.substring(1, 3);
        }

        if (/^\d{4}$/.test(text)) {
          return text.substring(0, 2) + ':' + text.substring(2, 4);
        }

        if (/^\d{1,2}:\d{1,2}$/.test(text)) {
          const teile = text.split(':');
          const stunde = Number(teile[0]);
          const minute = Number(teile[1]);
          if (isNaN(stunde) || isNaN(minute) || stunde > 23 || minute > 59) return String(wert || '').trim();
          return String(stunde).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
        }

        return String(wert || '').trim();
      }

      function uhrzeitFeldNormalisieren(feld) {
        if (!feld) return;
        feld.value = normalisiereUhrzeitEingabe(feld.value);
        aktualisiereFeldOptik(feld.closest('[data-slot-index]') || document);
      }

      function feldHatWert(el) {
        if (!el) return false;
        if (el.classList && el.classList.contains('multi-picker')) {
          return !!el.querySelector('input[type="checkbox"]:checked');
        }
        return String(el.value || '').trim() !== '';
      }

      function aktualisiereFeldOptik(root) {
        const basis = root || document;
        basis.querySelectorAll('input, select, textarea').forEach(function(el) {
          if (el.type === 'hidden' || el.type === 'checkbox') return;
          if (feldHatWert(el)) el.classList.add('feld-gefuellt');
          else el.classList.remove('feld-gefuellt');
        });

        basis.querySelectorAll('.multi-picker').forEach(function(picker) {
          const input = picker.querySelector('.multi-picker-input');
          if (!input) return;
          if (feldHatWert(picker)) input.classList.add('feld-gefuellt');
          else input.classList.remove('feld-gefuellt');
        });
      }

      function feldOptikEventsAktivieren(root) {
        const basis = root || document;
        basis.querySelectorAll('input, select, textarea').forEach(function(el) {
          if (el.type === 'hidden' || el.type === 'checkbox') return;
          el.addEventListener('input', function() { aktualisiereFeldOptik(document.getElementById('bereichMaischeannahme') || basis); });
          el.addEventListener('change', function() { aktualisiereFeldOptik(document.getElementById('bereichMaischeannahme') || basis); });
        });
        aktualisiereFeldOptik(basis);
      }


      function normalisiereFassnummernEingabe(wert) {
        return String(wert || '')
          .trim()
          .replace(/\s*(?:und|\+|&|,|;)\s*/gi, ' / ')
          .replace(/\s*\/\s*/g, ' / ')
          .replace(/\s{2,}/g, ' ');
      }

      function leseMaischeSlots() {
        const terminMaischeGlobal = document.getElementById('maischeTerminMaischeGlobal').value;
        const anzahlBraendeGlobal = document.getElementById('maischeAnzahlBraendeGlobal').value || '1';
        const zollOkGlobal = document.getElementById('maischeZollOkGlobal').value || '';

        return Array.prototype.slice.call(document.querySelectorAll('#maischeSlotsContainer [data-slot-index]')).map(function(root) {
          const anteile = leseFassanteile(root);
          const fassnummern = anteile.map(function(a) { return a.fassnummer; }).filter(Boolean).join(' / ');
          const volumenText = anteile.map(function(a) { return (a.fassnummer || 'Fass') + ': ' + (a.fassvolumen || ''); }).join(' | ');
          const inhaltText = anteile.map(function(a) { return (a.fassnummer || 'Fass') + ': ' + (a.fassinhalt || ''); }).join(' | ');
          const materialAusFass = anteile.map(function(a) { return a.material; }).filter(Boolean).filter(function(v, i, arr) { return arr.indexOf(v) === i; });
          const gewuerzeAusFass = anteile.map(function(a) { return a.gewuerze; }).filter(Boolean).filter(function(v, i, arr) { return arr.indexOf(v) === i; });
          return {
            bestehendeZeile: root.querySelector('.maische-bestehendeZeile').value.trim(),
            terminMaische: terminMaischeGlobal,
            tagBrand: root.querySelector('.maische-tagBrand').value,
            von: normalisiereUhrzeitEingabe(root.querySelector('.maische-von').value),
            bis: normalisiereUhrzeitEingabe(root.querySelector('.maische-bis').value),
            brenner: root.querySelector('.maische-brenner').value,
            fassnummern: normalisiereFassnummernEingabe(fassnummern),
            fassgroesse: volumenText,
            inhalt: inhaltText,
            materialien: materialAusFass,
            material: materialAusFass,
            gewuerze: gewuerzeAusFass,
            fassSplittung: kombiniereFassanteileUndBemerkung(anteile, root.querySelector('.maische-fassSplittung').value.trim()),
            anzahlBraende: anzahlBraendeGlobal,
            zollOk: zollOkGlobal
          };
        });
      }

      function validiereMaischePayload(payload) {
        if (!payload.vorgangsId) {
          zeigeStatus('statusBoxMaische', 'Vorgangs_ID fehlt.', 'error');
          return false;
        }

        if (!payload.stoffbesitzer) {
          zeigeStatus('statusBoxMaische', 'Stoffbesitzer fehlt.', 'error');
          return false;
        }

        if (!payload.terminMaische) {
          zeigeStatus('statusBoxMaische', 'Termin fehlt.', 'error');
          return false;
        }

        if (!payload.slots.length) {
          zeigeStatus('statusBoxMaische', 'Es ist kein Slot vorhanden.', 'error');
          return false;
        }

        if (payload.zollAbgelehnt && !payload.ablehnungBemerkung) {
          zeigeStatus('statusBoxMaische', 'Bemerkung zur Zoll-Ablehnung fehlt.', 'error');
          return false;
        }

        if (payload.zollGenehmigt && !payload.registernummer) {
          zeigeStatus('statusBoxMaische', 'Bei Genehmigung muss die Registernummer gefüllt sein.', 'error');
          return false;
        }

        for (let i = 0; i < payload.slots.length; i++) {
          const slot = payload.slots[i];
          const nr = i + 1;

          if (!slot.fassnummern) {
            zeigeStatus('statusBoxMaische', 'Mindestens ein Fassanteil fehlt in Brand ' + nr + '.', 'error');
            return false;
          }

          if (!slot.fassSplittung || String(slot.fassSplittung).indexOf('FASSANTEILE_DIESES_BRANDS:') === -1) {
            zeigeStatus('statusBoxMaische', 'Fass-Zuordnung fehlt in Brand ' + nr + '.', 'error');
            return false;
          }

          const unvollstaendig = slot.fassSplittung.split(/\r?\n/).some(function(zeile) {
            const text = String(zeile || '').trim();
            if (!/^[-•]?\s*Fass\s+/i.test(text)) return false;
            const teile = {};
            text.split('|').forEach(function(part) {
              const m = String(part || '').match(/^\s*([^:]+?)\s*:\s*(.*?)\s*$/);
              if (m) teile[String(m[1] || '').trim().toLowerCase()] = String(m[2] || '').trim();
            });
            return !teile.fassvolumen || !teile.fassinhalt || !teile.material;
          });
          if (unvollstaendig) {
            zeigeStatus('statusBoxMaische', 'Fassnummer, Fassvolumen, Fassinhalt und Material müssen je Fass in Brand ' + nr + ' gefüllt sein.', 'error');
            return false;
          }

          if (!slot.tagBrand) {
            zeigeStatus('statusBoxMaische', 'Brandtag fehlt in Slot ' + nr + '.', 'error');
            return false;
          }

          if (!slot.von || !slot.bis) {
            zeigeStatus('statusBoxMaische', 'von/bis fehlt in Slot ' + nr + '.', 'error');
            return false;
          }

          if (!slot.brenner) {
            zeigeStatus('statusBoxMaische', 'Brenner fehlt in Slot ' + nr + '.', 'error');
            return false;
          }
        }

        return true;
      }

      function speichernMaischeannahmeFrontend() {
        if (busy) return;

        const statusAuswahl = document.getElementById('maischeZollOkGlobal').value;
        const payload = {
          vorgangsId: document.getElementById('maischeVorgang').value || document.getElementById('maischeVorgangsId').value,
          stoffbesitzer: document.getElementById('maischeStoffbesitzer').value.trim(),
          terminMaische: document.getElementById('maischeTerminMaischeGlobal').value,
          bemerkungVorplanung: document.getElementById('maischeBemerkungVorplanung').value,
          infoSystem: document.getElementById('maischeBemerkungVorplanung').value,
          registernummer: document.getElementById('maischeRegistriernummer').value.trim(),
          status: 'OFFEN',
          zollAbgelehnt: istZollAblehnungWert(statusAuswahl),
          zollGenehmigt: istZollGenehmigtWert(statusAuswahl),
          ablehnungBemerkung: document.getElementById('maischeZollAblehnungBemerkung').value.trim(),
          dossierLink: document.getElementById('maischeDossierLink').value.trim(),
          slots: leseMaischeSlots()
        };

        if (!validiereMaischePayload(payload)) return;

        setBusy(true);
        zeigeToast('Vorgang wird gespeichert …', 'info', { autoMs: 0 });
        zeigeStatus('statusBoxMaische', 'Vorgang wird gespeichert …', 'info');

        google.script.run
          .withSuccessHandler(function(result) {
            setBusy(false);
            resetMaischeFormular();
            fuelleMaischeDropdownVorgaenge();
            const meldung = result && result.verschobenNachBrandtag
              ? 'Vorgang gespeichert und an den Leitstand übergeben.'
              : (result && result.archiviert ? 'Vorgang gespeichert und archiviert.' : 'Vorgang gespeichert.');
            zeigeStatus('statusBoxMaische', meldung, 'ok');
            window.setTimeout(nachSpeichernZurueckInsHauptmenue, 900);
          })
          .withFailureHandler(function(err) {
            setBusy(false);
            zeigeStatus('statusBoxMaische', 'Speichern fehlgeschlagen: ' + leseFehler(err), 'error');
          }).saveVorgangsbearbeitung(payload);
      }

      function checklisteAusMaskeErzeugen() {
        if (busy) return;
        const vorgangsId = document.getElementById('maischeVorgang').value || document.getElementById('maischeVorgangsId').value;
        if (!vorgangsId) {
          zeigeStatus('statusBoxMaische', 'Für die Checkliste muss ein Vorgang gewählt sein.', 'error');
          return;
        }
        setBusy(true);
        zeigeStatus('statusBoxMaische', 'Checkliste wird erzeugt / versendet …', 'info');
        google.script.run
          .withSuccessHandler(function(result) {
            setBusy(false);
            zeigeStatus('statusBoxMaische', (result && result.hinweis) ? result.hinweis : 'Checkliste verarbeitet.', 'ok');
          })
          .withFailureHandler(function(err) {
            setBusy(false);
            zeigeStatus('statusBoxMaische', 'Checkliste fehlgeschlagen: ' + leseFehler(err), 'error');
          })
          .pruefeUndVersendeChecklisteNachBrandplanung(vorgangsId);
      }

      document.addEventListener('click', function(event) {
        if (!event.target.closest('.multi-picker')) {
          document.querySelectorAll('.multi-picker.open').forEach(function(picker) {
            picker.classList.remove('open');
            aktualisiereMultiPicker(picker);
          });
        }
      });

      window.addEventListener('load', function() {
        zeigeStartUebersicht();
        document.getElementById('statusBoxVorplanung').style.display = 'none';
        document.getElementById('statusBoxMaische').style.display = 'none';
        feldOptikEventsAktivieren(document);

        if (START_MODUS === 'vorplanung') {
          oeffneVorplanung();
          return;
        }

        if (START_MODUS === 'maischeannahme' || START_MODUS === 'brennfreigabe' || START_MODUS === 'vorgang') {
          oeffneVorgangsbearbeitung();
          return;
        }
      });
    </script>
  </body>
</html>
